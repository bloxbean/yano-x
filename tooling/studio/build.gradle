plugins {
    id 'base'
    id 'com.github.node-gradle.node' version '7.1.0'
}

node {
    version = '22.12.0'
    download = true
}

def studioOutput = layout.buildDirectory.dir('studio')
tasks.register('prepareStudio', Sync) {
    from('src/main/web')
    from(rootProject.file('sdk/javascript')) {
        into 'assets/topics'
        include '*.mjs'
    }
    from(project(':tooling:devtools').file('src/test/resources/topics/plan-v1.json')) {
        into 'assets'
        rename { 'topics-plan-v1.json' }
    }
    // Binding editor starters (ADR-031.2); examples/bindings stays their single source.
    from(rootProject.file('examples/bindings')) {
        into 'assets/bindings'
        include 'registry-to-audit.yaml', 'approval-to-audit.yaml', 'balances-transfer-limit.yaml',
                'procurement-admission.yaml', 'fixtures/*/fixture-*.json'
        // The governed §6.3 recipe and the ADR-031.4 recipes need their own contexts, so they are not Studio starters.
        exclude 'fixtures/dpp-role-gated/**', 'fixtures/asset-governed-limits/**',
                'fixtures/dpp-namespace-isolation/**', 'fixtures/feed-slot-rules/**',
                'fixtures/balances-holding-cap/**'
    }
    into studioOutput
}

tasks.register('studioZip', Zip) {
    dependsOn tasks.named('prepareStudio')
    archiveFileName = "yano-x-studio-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(studioOutput)
}

tasks.register('testStudio', NodeTask) {
    // The YAML differential corpus is parsed by the exact Java binding parser before Studio tests run.
    def yamlOracle = project(':tooling:devtools').tasks.named('generateStudioYamlOracle')
    def receiptOracle = project(':tooling:devtools').tasks.named('generateStudioReceiptOracle')
    dependsOn yamlOracle, receiptOracle, tasks.named('prepareStudio')
    inputs.dir('src/main/web')
    inputs.dir('src/test')
    inputs.files(yamlOracle.map { it.outputs.files }, receiptOracle.map { it.outputs.files })
    outputs.upToDateWhen { false }
    options = ['--test']
    script = file('src/test/studio-yaml.test.mjs')
    args = fileTree('src/test') { include '*.test.mjs'; exclude 'studio-yaml.test.mjs' }.files
            .collect { it.absolutePath }.sort()
    def oracles = project(':tooling:devtools').layout.buildDirectory.dir('studio-oracle').get().asFile
    environment = [STUDIO_YAML_ORACLE: new File(oracles, 'yaml-oracle.json').absolutePath,
                   STUDIO_RECEIPT_ORACLE: new File(oracles, 'receipt-oracle.json').absolutePath]
}

// Documents exported by Studio's draft model for the Java compiler round-trip gate (ADR-031.2 M1).
tasks.register('exportStudioRoundTrip', NodeTask) {
    inputs.dir('src/main/web')
    inputs.dir('src/test')
    inputs.dir(rootProject.file('examples/bindings'))
    outputs.dir(layout.buildDirectory.dir('roundtrip'))
    script = file('src/test/roundtrip-export.mjs')
    args = [layout.buildDirectory.dir('roundtrip').get().asFile.absolutePath]
}

// Browser, keyboard and accessibility gates for the binding editor (ADR-031.2). Runs the docsite's Playwright
// install against the prepared Studio; requires `npm ci` in www/ and `npx playwright install chromium` once.
// The packaged CLI and bundles let the suite recompile the keyboard-authored document with the real compiler.
tasks.register('browserTestStudio', Exec) {
    group = 'verification'
    description = 'Runs the Studio binding editor browser, keyboard and accessibility tests'
    def bindingBundles = [':composition:runtime', ':capabilities:role-workflow', ':state-machines:stdlib']
            .collect { project(it).tasks.named('shadowJar') }
    dependsOn tasks.named('prepareStudio'), bindingBundles, ':tooling:appchain-cli:installDist'
    inputs.dir(studioOutput)
    inputs.dir(rootProject.file('www/tests-studio'))
    outputs.upToDateWhen { false }
    workingDir rootProject.file('www')
    commandLine 'npx', 'playwright', 'test', '-c', 'playwright.studio.config.mjs'
    doFirst {
        environment 'STUDIO_DIR', studioOutput.get().asFile.absolutePath
        environment 'BINDING_CLI', project(':tooling:appchain-cli').layout.buildDirectory
                .file('install/yano-appchain/bin/yano-appchain').get().asFile.absolutePath
        environment 'BINDING_BUNDLES', bindingBundles.collect { it.get().archiveFile.get().asFile.absolutePath }
                .join(File.pathSeparator)
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('studioZip')
}

tasks.register('testTopicClients', NodeTask) {
    group = 'verification'
    description = 'Checks the dependency-free topic client against frozen core wire and signature vectors'
    inputs.dir(rootProject.file('sdk/javascript'))
    outputs.upToDateWhen { false }
    options = ['--test']
    def tests = rootProject.fileTree('sdk/javascript/test') { include '*.test.mjs' }.files.sort()
    script = tests.first()
    args = tests.drop(1).collect { it.absolutePath }
}

tasks.named('check') {
    dependsOn tasks.named('testStudio'), tasks.named('testTopicClients')
}
