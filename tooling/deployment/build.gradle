plugins {
    id 'application'
}

dependencies {
    implementation project(':ledgers:eutxo:demo')
    implementation libs.cardano.client.crypto
    implementation libs.jackson.databind
    implementation libs.jackson.dataformat.yaml
    implementation libs.json.schema.validator
}

sourceSets {
    main {
        resources {
            srcDir rootProject.file('deployment/schema')
            include 'yano-cluster-deployment.schema.json'
        }
    }
}

application {
    applicationName = 'yano-x-deploy'
    mainClass = 'org.yanoproject.x.deployment.YanoDeploymentCli'
    applicationDefaultJvmArgs = ['-Xmx512m']
}

distributions {
    main {
        distributionBaseName = 'yano-x-deploy'
        contents {
            from('README.md')
            from(rootProject.file('deployment')) {
                into 'deployment'
            }
        }
    }
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano X Deployment Tool'
                description = 'Provider-neutral OpenTofu and Ansible deployment compiler for Yano X app chains'
            }
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

tasks.named('test') {
    systemProperty 'yano.test.repo-root', rootProject.projectDir.absolutePath
    if (System.getProperty('yano.test.showcase-zip')) {
        systemProperty 'yano.test.showcase-zip', System.getProperty('yano.test.showcase-zip')
    }
}
