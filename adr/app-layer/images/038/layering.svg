<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" role="img" aria-label="Yano X ADR-038: where each part lives, Yano core and Yano X"><title>Yano X ADR-038: where each part lives, Yano core and Yano X</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker></defs><rect x="0" y="0" width="1180" height="600" fill="#ffffff"/><text x="20" y="30" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2533" text-anchor="start">Topic policies: what core owns and what Yano X adds</text><text x="20" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6478" text-anchor="start">Dependency direction stays yano-x → yano. Core evaluates committed bytes; Yano X authors them and builds the developer experience.</text><rect x="20" y="70" width="540" height="510" rx="12" fill="none" stroke="#2a7ab0" stroke-width="1.4" stroke-dasharray="7 5"/><text x="32" y="88" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2a7ab0" text-anchor="start">Yano core (ADR app-layer/039)</text><rect x="40" y="100" width="500" height="70" rx="8" fill="#eaf7ef" stroke="#2e8b57" stroke-width="1.4"/><text x="50" y="119.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2e8b57" text-anchor="start">Topic registry in consensus state</text><text x="50" y="136.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">namespaces, owners, policies, revisions under ~yano/topics/v1/</text><rect x="40" y="182" width="500" height="70" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="50" y="201.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">TopicPolicy.check</text><text x="50" y="218.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">ingress, proposer and follower; refusal codes TOPIC_*</text><rect x="40" y="264" width="500" height="70" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="50" y="283.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">Frames, writer proofs, delegations, replay guard</text><text x="50" y="300.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">Ed25519 over canonical CBOR statements; block-time windows</text><rect x="40" y="346" width="500" height="70" rx="8" fill="#eef6fb" stroke="#2a7ab0" stroke-width="1.4"/><text x="50" y="365.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2a7ab0" text-anchor="start">Schema IR evaluator</text><text x="50" y="382.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">yano-cbor-schema-ir-v1 — moved here from Yano X; bounded and total</text><rect x="40" y="428" width="500" height="60" rx="8" fill="#eef6fb" stroke="#2a7ab0" stroke-width="1.4"/><text x="50" y="447.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2a7ab0" text-anchor="start">TopicMessageView (plugin API)</text><text x="50" y="464.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">payload() and the verified writer for every machine</text><rect x="40" y="500" width="500" height="60" rx="8" fill="#eef6fb" stroke="#2a7ab0" stroke-width="1.4"/><text x="50" y="519.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2a7ab0" text-anchor="start">Read APIs and proof subject</text><text x="50" y="536.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">topics/entries, topics/resolve, topic-policy-v1</text><rect x="620" y="70" width="540" height="510" rx="12" fill="none" stroke="#d98a1a" stroke-width="1.4" stroke-dasharray="7 5"/><text x="632" y="88" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#d98a1a" text-anchor="start">Yano X (this ADR)</text><rect x="640" y="100" width="500" height="62" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="650" y="119.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">X1 · authenticated map uses the core evaluator</text><text x="650" y="136.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">same IR bytes, same results; one implementation</text><rect x="640" y="172" width="500" height="62" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="650" y="191.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">X2 · CddlSchemaCompiler</text><text x="650" y="208.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">cddl-yano-subset-v1 → IR, for collections and topics</text><rect x="640" y="244" width="500" height="62" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="650" y="263.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">X3 · yano.sh appchain topics</text><text x="650" y="280.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">init · plan · sign · submit · resolve · delegate · verify</text><rect x="640" y="316" width="500" height="62" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="650" y="335.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">X4 · admission rules: payload.* and writer.*</text><text x="650" y="352.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">typed fields of schema-typed topics; verified writer; forbid-only</text><rect x="640" y="388" width="500" height="62" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="650" y="407.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">X5 · composites bind to registered topics</text><text x="650" y="424.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">doctor checks; schemas only on opaque-body machines</text><rect x="640" y="460" width="245" height="100" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="650" y="479.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">X6 · Studio Topics view</text><text x="650" y="496.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">tree, policies, history, proofs;</text><text x="650" y="511.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">exports unsigned commands</text><rect x="895" y="460" width="245" height="100" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="905" y="479.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">X7/X8 · clients and reference</text><text x="905" y="496.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">JS and Java frame and delegation</text><text x="905" y="511.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">libraries; delegation service; game</text><text x="905" y="526.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">center</text><path d="M 640 150 L 590 150 L 590 381 L 540 381" fill="none" stroke="#4a5368" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="596" y="294.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="start">calls</text><path d="M 640 347 L 612 347 L 612 458 L 540 458" fill="none" stroke="#4a5368" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="606" y="414.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="end">reads</text></svg>
