<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-label="Yano X ADR-038: Neon Rush with delegated session keys"><title>Yano X ADR-038: Neon Rush with delegated session keys</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker></defs><rect x="0" y="0" width="1180" height="680" fill="#ffffff"/><text x="20" y="30" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2533" text-anchor="start">Reference: Neon Rush with delegated session keys</text><text x="20" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6478" text-anchor="start">The static game page never holds an issuer key. A tiny delegation service does, and members refuse forged, malformed and replayed rides before they are stored.</text><rect x="20" y="70" width="240" height="40" rx="8" fill="#eaf2ff" stroke="#3b6fd8" stroke-width="1.4"/><text x="140.0" y="89.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3b6fd8" text-anchor="middle">Player browser</text><line x1="140" y1="110" x2="140" y2="665" stroke="#c9ced8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="320" y="70" width="240" height="40" rx="8" fill="#eaf2ff" stroke="#3b6fd8" stroke-width="1.4"/><text x="440.0" y="89.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3b6fd8" text-anchor="middle">Delegation service</text><line x1="440" y1="110" x2="440" y2="665" stroke="#c9ced8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="630" y="70" width="240" height="40" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="750.0" y="89.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="middle">Members (games/neon-rush/)</text><line x1="750" y1="110" x2="750" y2="665" stroke="#c9ced8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="920" y="70" width="240" height="40" rx="8" fill="#eaf7ef" stroke="#2e8b57" stroke-width="1.4"/><text x="1040.0" y="89.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2e8b57" text-anchor="middle">Registry and ledger state</text><line x1="1040" y1="110" x2="1040" y2="665" stroke="#c9ced8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="920" y="125" width="240" height="104" rx="8" fill="#eaf7ef" stroke="#2e8b57" stroke-width="1.4"/><text x="930" y="144.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2e8b57" text-anchor="start">0 · publisher setup</text><text x="930" y="161.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">games/ claimed (open mode) or</text><text x="930" y="176.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">created by a registrar; policy of</text><text x="930" y="191.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">games/neon-rush/: writers = delegate</text><text x="930" y="206.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">= [issuer], schema ride-v1</text><circle cx="26" cy="152" r="10" fill="#3b6fd8"/><text x="26" y="156" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><rect x="46" y="128" width="210" height="64" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="56" y="147.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">sign in</text><text x="56" y="164.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">commander profile key</text><text x="56" y="179.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">(unchanged)</text><circle cx="26" cy="236" r="10" fill="#3b6fd8"/><text x="26" y="240" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="46" y="212" width="210" height="56" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="56" y="231.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">session key</text><text x="56" y="248.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">Ed25519 in WebCrypto</text><path d="M 256 240 L 440 240" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="348" y="220" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#3a4256" text-anchor="middle">profile-signed request</text><text x="348" y="233" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#3a4256" text-anchor="middle">+ session public key</text><circle cx="26" cy="320" r="10" fill="#3b6fd8"/><text x="26" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><rect x="340" y="286" width="210" height="84" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="350" y="305.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">check and sign</text><text x="350" y="322.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">profile signature valid → 1 h</text><text x="350" y="337.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">delegation, scope</text><text x="350" y="352.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">games/neon-rush/</text><path d="M 340 340 L 140 340" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="240" y="327.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">delegation</text><circle cx="26" cy="420" r="10" fill="#3b6fd8"/><text x="26" y="424" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><rect x="46" y="392" width="210" height="80" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="56" y="411.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">ride, then frame</text><text x="56" y="428.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">inputs → canonical CBOR</text><text x="56" y="443.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">payload; the session key signs</text><text x="56" y="458.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">the write</text><path d="M 256 430 L 750 430" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="503" y="417.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">POST /messages  games/neon-rush/s&lt;season&gt;</text><circle cx="26" cy="520" r="10" fill="#3b6fd8"/><text x="26" y="524" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><rect x="640" y="470" width="230" height="112" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="650" y="489.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">core checks</text><text x="650" y="506.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">issuer allowed · scope · 1 h</text><text x="650" y="521.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">window · session signature ·</text><text x="650" y="536.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">unused proof · ride-v1 schema →</text><text x="650" y="551.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">else HTTP 400 TOPIC_*</text><path d="M 870 505 L 1040 505" fill="none" stroke="#4a5368" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><text x="955" y="492.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">policy at height</text><circle cx="26" cy="620" r="10" fill="#3b6fd8"/><text x="26" y="624" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><path d="M 750 615 L 1040 615" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="895" y="602.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">final; proof hash → used/</text><path d="M 750 640 L 140 640" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="445" y="627.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">accepted; every browser still replays the ride for its time</text></svg>
