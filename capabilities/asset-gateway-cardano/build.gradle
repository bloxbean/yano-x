plugins {
    id 'com.gradleup.shadow'
}

dependencies {
    compileOnly project(':framework:api')
    implementation project(':capabilities:asset-gateway-cardano-support')
    compileOnly libs.yaci.core
    compileOnly libs.cardano.client.address
    compileOnly libs.cardano.client.common
    compileOnly libs.cardano.client.crypto
    compileOnly libs.cbor

    testImplementation project(':framework:api')
    testImplementation libs.yaci.core
    testImplementation libs.cardano.client.address
    testImplementation libs.cardano.client.common
    testImplementation libs.cardano.client.crypto
    testImplementation libs.cardano.client.core
    testImplementation libs.cbor
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.named('shadowJar') {
    archiveBaseName.set(rootProject.ext.artifactByPath[project.path].artifactId.toString())
    archiveClassifier.set('bundle')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    mergeServiceFiles()
    exclude 'org/yanoproject/api/**', 'org/yanoproject/x/framework/api/**',
            'org/yanoproject/x/framework/cardano/api/**'
    exclude 'com/bloxbean/cardano/yaci/**'
    exclude 'com/bloxbean/cardano/client/**'
    exclude 'co/nstant/in/cbor/**'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
}

tasks.register('verifyAssetGatewayCardanoArtifactBoundaries') {
    group = 'verification'
    description = 'Verifies the gateway bundle embeds its contracts and support code but no host or Cardano classes'
    dependsOn tasks.named('jar'), tasks.named('shadowJar')
    inputs.files(tasks.named('jar').flatMap { it.archiveFile },
            tasks.named('shadowJar').flatMap { it.archiveFile })

    doLast {
        def entries = { File archive ->
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                zip.entries().collect { entry -> entry.name }.toSet()
            }
        }
        def thinEntries = entries(tasks.named('jar').get().archiveFile.get().asFile)
        def bundleEntries = entries(tasks.named('shadowJar').get().archiveFile.get().asFile)
        def forbiddenPrefixes = [
                'org/yanoproject/api/',
                'org/yanoproject/x/framework/api/',
                'org/yanoproject/x/framework/cardano/api/',
                'com/bloxbean/cardano/yaci/',
                'com/bloxbean/cardano/client/',
                'co/nstant/in/cbor/',
                'org/julclang/',
                'org/zeroj/'
        ]
        def forbidden = bundleEntries.findAll { entry ->
            forbiddenPrefixes.any { prefix -> entry.startsWith(prefix) }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException(
                    'Asset-gateway bundle embeds host, Cardano, Julc, or ZeroJ classes: '
                            + forbidden.toList().sort().take(10))
        }
        def contractClass = 'org/yanoproject/x/assets/contracts/AssetDepositClaimV1.class'
        def supportClass = 'org/yanoproject/x/assets/cardano/support/DatumPreflight.class'
        def providerClass = 'org/yanoproject/x/assets/cardano/gateway/AssetVaultDepositObserverProvider.class'
        if (thinEntries.contains(contractClass) || !bundleEntries.contains(contractClass)
                || thinEntries.contains(supportClass) || !bundleEntries.contains(supportClass)
                || !thinEntries.contains(providerClass) || !bundleEntries.contains(providerClass)) {
            throw new GradleException('Asset-gateway thin/bundle class boundary is incomplete')
        }
        def manifests = bundleEntries.findAll { it.startsWith('META-INF/yano/plugins/') && it.endsWith('.json') }
        if (manifests != ['META-INF/yano/plugins/org.yanoproject.x.asset-gateway.cardano.json'] as Set) {
            throw new GradleException("Asset-gateway bundle manifests are not isolated: ${manifests}")
        }
    }
}

tasks.register('verifyAssetGatewayCardanoDependencyGraph') {
    group = 'verification'
    description = 'Verifies the gateway runtime graph contains no Julc or ZeroJ implementation'

    doLast {
        def forbidden = configurations.runtimeClasspath.incoming.resolutionResult.allComponents
                .collect { component -> component.id.displayName }
                .findAll { identity ->
                    def lower = identity.toLowerCase(java.util.Locale.ROOT)
                    lower.contains('julc') || lower.contains('zeroj')
                }
        if (!forbidden.isEmpty()) {
            throw new GradleException(
                    "Asset-gateway runtime dependency boundary is violated: ${forbidden.sort()}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyAssetGatewayCardanoArtifactBoundaries'),
            tasks.named('verifyAssetGatewayCardanoDependencyGraph')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano X Asset Gateway Cardano'
                description = 'Optional Cardano asset-gateway runtime bundle: the multi-asset vault deposit observer (ADR-059 D5)'
            }
        }
    }
}
