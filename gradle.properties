group=org.yanoproject.x
version=0.1.0-pre6
# Release side effect of a v* tag, independent of the Maven Central deployment. The Central deployment
# is always staged (USER_MANAGED) and needs a human to publish it, but the GitHub release is public
# the moment the tag is pushed. Set to false to rehearse the release pipeline end to end without
# publishing anything.
github_release=true

# Where a v* tag publishes the Maven artifacts (docs/12-bloxbean-maven-repository.md). Both are built and signed once,
# so with both true the same files go to both. A Central deployment is staged and still needs a human to publish it;
# the BloxBean repository (https://repo.bloxbean.org/maven/releases) is public, and permanent, the moment the release
# run uploads it. Turn Central off to release to the BloxBean repository only (e.g. Central's quota is exhausted).
maven_central_publish=true
bloxbean_repo_publish=true

# Exact Yano inputs (Maven version and matching JVM ZIP). An optional .github/ci-input-pins.json pins the staging run
# that produced them; see .github/COORDINATED_INPUTS.md (the final pin is set before merge).
# Every Yano module (node-api, cardano-api, host-api, runtime, ...) resolves at this one version. Override with
# -PyanoVersion or ORG_GRADLE_PROJECT_yanoVersion for compatibility tests.
yanoVersion=0.1.0-pre22
quarkusPluginVersion=3.33.2.1
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.33.2.1
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
