group=org.yanoproject.x
version=0.1.0-pre2-dev1
# Release side effect of a v* tag, independent of the Maven Central deployment. The Central deployment
# is always staged (USER_MANAGED) and needs a human to publish it, but the GitHub release is public
# the moment the tag is pushed. Set to false to rehearse the release pipeline end to end without
# publishing anything.
github_release=true
yanoVersion=0.1.0-pre15
quarkusPluginVersion=3.33.2.1
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.33.2.1
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
