plugins {
    id 'java-library'
}

description = 'Julc-authored Cardano validators for the optional EUTxO bridge'

dependencies {
    compileOnly "org.julclang:julc-stdlib:${libs.versions.julc.get()}"
    compileOnly "org.julclang:julc-ledger-api:${libs.versions.julc.get()}"
    compileOnly project(':sdk:proof-onchain')

    testImplementation "org.julclang:julc-stdlib:${libs.versions.julc.get()}"
    testImplementation "org.julclang:julc-ledger-api:${libs.versions.julc.get()}"
    testImplementation "org.julclang:julc-testkit:${libs.versions.julc.get()}"
    testImplementation "org.julclang:julc-compiler:${libs.versions.julc.get()}"
    testImplementation "org.julclang:julc-vm-java:${libs.versions.julc.get()}"
    testImplementation "org.julclang:julc-cardano-client-lib:${libs.versions.julc.get()}"
    testImplementation project(':sdk:proof-onchain')
    testImplementation project(':ledgers:eutxo:contracts')
    testImplementation project(':ledgers:eutxo:client')
    testImplementation libs.cardano.client.crypto
    testImplementation libs.cardano.client.mpf
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.withType(Test).configureEach {
    def regeneratePlutus = System.getProperty('yano.regenerate.plutus')
    if (regeneratePlutus != null) {
        systemProperty 'yano.regenerate.plutus', regeneratePlutus
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano EUTxO Bridge Validators'
                description = 'Staging and one-way vault validators authored with Julc'
            }
        }
    }
}
