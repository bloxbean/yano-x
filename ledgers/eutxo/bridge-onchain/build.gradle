plugins {
    id 'java-library'
}

description = 'Julc-authored Cardano validators for the optional EUTxO bridge'

dependencies {
    compileOnly "com.bloxbean.cardano:julc-stdlib:${libs.versions.julc.get()}"
    compileOnly "com.bloxbean.cardano:julc-ledger-api:${libs.versions.julc.get()}"
    compileOnly project(':sdk:proof-onchain')

    testImplementation "com.bloxbean.cardano:julc-stdlib:${libs.versions.julc.get()}"
    testImplementation "com.bloxbean.cardano:julc-ledger-api:${libs.versions.julc.get()}"
    testImplementation "com.bloxbean.cardano:julc-testkit:${libs.versions.julc.get()}"
    testImplementation "com.bloxbean.cardano:julc-compiler:${libs.versions.julc.get()}"
    testImplementation "com.bloxbean.cardano:julc-vm-java:${libs.versions.julc.get()}"
    testImplementation "com.bloxbean.cardano:julc-cardano-client-lib:${libs.versions.julc.get()}"
    testImplementation project(':sdk:proof-onchain')
    testImplementation project(':ledgers:eutxo:contracts')
    testImplementation project(':ledgers:eutxo:client')
    testImplementation libs.cardano.client.crypto
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.withType(Test).configureEach {
    def regeneratePlutus = System.getProperty('yano.regenerate.plutus')
    if (regeneratePlutus != null) {
        systemProperty 'yano.regenerate.plutus', regeneratePlutus
    }
}

// Retained deployment templates were compiled with pre14. A compiler upgrade
// is not an implicit authorization to change script hashes. Reproduce those
// exact bytes in an isolated test runtime; current conformance tests still use
// the repository's current compiler/VM (including its newer ledger APIs).
def settlementArtifactCompilerVersion = '0.1.0-pre14'
def settlementArtifactRuntime = configurations.create('settlementArtifactRuntimeClasspath') {
    canBeConsumed = false
    canBeResolved = true
    extendsFrom configurations.testRuntimeClasspath
}
configurations.testRuntimeClasspath.attributes.keySet().each { key ->
    settlementArtifactRuntime.attributes.attribute(key,
            configurations.testRuntimeClasspath.attributes.getAttribute(key))
}
settlementArtifactRuntime.resolutionStrategy.eachDependency { details ->
    if (details.requested.group == 'com.bloxbean.cardano'
            && details.requested.name.startsWith('julc-')) {
        details.useVersion settlementArtifactCompilerVersion
        details.because 'Reproduce retained settlement deployment templates without changing script hashes'
    }
}
tasks.register('verifySettlementArtifacts', Test) {
    group = 'verification'
    description = 'Reproduces retained settlement templates with their pinned Julc compiler.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.output + sourceSets.main.output + settlementArtifactRuntime
    include '**/SettlementArtifactBundleTest.class'
    inputs.property('settlementArtifactCompilerVersion', settlementArtifactCompilerVersion)
}
tasks.named('test', Test) {
    dependsOn tasks.named('verifySettlementArtifacts')
    exclude '**/SettlementArtifactBundleTest.class'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano EUTxO Bridge Validators'
                description = 'Staging and one-way vault validators authored with Julc'
            }
        }
    }
}
