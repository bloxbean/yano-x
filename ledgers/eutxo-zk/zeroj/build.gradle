plugins {
    id 'java-library'
}

dependencies {
    api project(':ledgers:eutxo-zk:contracts')
    implementation libs.zeroj.api
    implementation libs.zeroj.bls12381
    implementation libs.zeroj.circuit.dsl
    implementation libs.zeroj.circuit.lib
    implementation libs.zeroj.crypto
    implementation libs.zeroj.mpf.poseidon
    implementation libs.zeroj.onchain.julc
    // ZeroJ pre10 was published against Julc pre14. Keep the adapter and every
    // downstream runtime on the reviewed public Julc line selected by Yano X.
    implementation "com.bloxbean.cardano:julc-compiler:${libs.versions.julc.get()}"
    implementation "com.bloxbean.cardano:julc-core:${libs.versions.julc.get()}"
    implementation "com.bloxbean.cardano:julc-ledger-api:${libs.versions.julc.get()}"
    implementation "com.bloxbean.cardano:julc-stdlib:${libs.versions.julc.get()}"

    testImplementation libs.zeroj.verifier.groth16
    testImplementation project(':ledgers:eutxo:testkit')
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.withType(Test).configureEach {
    systemProperty 'zeroj.allowInsecureTrustedSetup', 'true'
}

tasks.named('test') {
    maxHeapSize = '2g'
}

tasks.named('cryptoTest') {
    // The measured b16 Groth16 gate compiles and proves the full fixed circuit.
    maxHeapSize = '4g'
    classpath += sourceSets.test.output
}

sourceSets.cryptoTest.compileClasspath += sourceSets.test.output
sourceSets.cryptoTest.runtimeClasspath += sourceSets.test.output
tasks.named('compileCryptoTestJava') {
    dependsOn tasks.named('testClasses')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano EUTxO ZeroJ Validity'
                description = 'Optional ZeroJ Poseidon commitments and Groth16 circuits for Yano EUTxO'
            }
        }
    }
}
