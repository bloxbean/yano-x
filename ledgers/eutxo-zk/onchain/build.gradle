plugins {
    id 'java-library'
}

dependencies {
    api project(':ledgers:eutxo-zk:contracts')
    implementation libs.zeroj.onchain.julc

    constraints {
        // ZeroJ pre13 declares Julc pre18 transitively. Publish the reviewed
        // Yano X alignment so consumers cannot resolve that older runtime.
        implementation "org.julclang:julc-compiler:${libs.versions.julc.get()}"
        implementation "org.julclang:julc-core:${libs.versions.julc.get()}"
        implementation "org.julclang:julc-ledger-api:${libs.versions.julc.get()}"
        implementation "org.julclang:julc-stdlib:${libs.versions.julc.get()}"
    }

    compileOnly "org.julclang:julc-stdlib:${libs.versions.julc.get()}"
    compileOnly "org.julclang:julc-ledger-api:${libs.versions.julc.get()}"

    testImplementation project(':ledgers:eutxo-zk:zeroj')
    testImplementation libs.zeroj.crypto
    testImplementation libs.zeroj.circuit.lib
    testImplementation "org.julclang:julc-stdlib:${libs.versions.julc.get()}"
    testImplementation "org.julclang:julc-ledger-api:${libs.versions.julc.get()}"
    testImplementation "org.julclang:julc-testkit:${libs.versions.julc.get()}"
    testImplementation "org.julclang:julc-compiler:${libs.versions.julc.get()}"
    testImplementation libs.julc.cardano.client.lib
    testRuntimeOnly "org.julclang:julc-vm-java:${libs.versions.julc.get()}"
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.withType(Test).configureEach {
    systemProperty 'zeroj.allowInsecureTrustedSetup', 'true'
}

tasks.named('test') {
    maxHeapSize = '2g'
}

tasks.named('cryptoTest') {
    maxHeapSize = '4g'
}

sourceSets.cryptoTest.compileClasspath += sourceSets.test.output
sourceSets.cryptoTest.runtimeClasspath += sourceSets.test.output
tasks.named('compileCryptoTestJava') {
    dependsOn tasks.named('testClasses')
}
