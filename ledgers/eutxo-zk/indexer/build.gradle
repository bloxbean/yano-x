plugins {
    id 'java-library'
}

ext.runtimePluginBundleId =
        'com.bloxbean.cardano.yano.appchain.eutxo.zk.indexer'
ext.runtimePluginExcludedBundleIds = []
apply from: rootProject.file('gradle/runtime-plugin-bundle.gradle')

dependencies {
    api project(':ledgers:eutxo:indexer-core')
    implementation project(':ledgers:eutxo-zk:contracts')
    implementation project(':ledgers:eutxo-zk:zeroj')
    implementation libs.jackson.databind

    testImplementation project(':ledgers:eutxo-zk:lifecycle')
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano EUTxO ZK Index Adapter'
                description = 'ZeroJ lifecycle artifacts translated into provider-neutral EUTxO index records'
            }
        }
    }
}
