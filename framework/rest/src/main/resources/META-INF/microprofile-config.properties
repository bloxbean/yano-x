# Yano X app-chain REST defaults (ADR-064 D8). Ordinal 100: application and operator
# configuration (application.yml, config/application.yml, system properties, environment) win.

# ADR-040: the App Chain OpenAPI document. It contains only operations whose resource carries
# the AppChainApiGroup @Extension (SmallRye scan profile); /q/openapi still covers everything.
quarkus.smallrye-openapi.app-chain.scan-profiles=app-chain
quarkus.smallrye-openapi.app-chain.info-title=Yano App Chain API
quarkus.smallrye-openapi.app-chain.info-version=${quarkus.application.version:0.1.0}
quarkus.smallrye-openapi.app-chain.info-description=App-chain messages, blocks, state proofs, effects and plugin domain routes
quarkus.swagger-ui.urls."App\ Chain\ API"=/q/openapi-app-chain

# Per-message app-chain events: submits log at DEBUG, proposer-side drops
# and rejections at INFO. Set DEBUG to trace every message, WARN to mute.
quarkus.log.category."org.yanoproject.appchain.messages".level=INFO

# The REST surface needs the application-ledger root plugin; startup fails when
# yano.app-chain.enabled is true and an override drops it from this list.
yano.plugins.required=org.yanoproject.x.app-ledger

# App chain (parallel application ledger over the appmsg protocol).
# See adr/app-layer/005-yano-app-chain-framework.md. Disabled by default.
# Node-local app-chain RocksDB root. Relative paths use the process working
# directory, so the default is separate from ./chainstate.
yano.app-chain.storage.path=${YANO_APP_CHAIN_STORAGE_PATH:appchain-chainstate}

# Reference configuration, in the YAML form of config/application.yml under yano.app-chain:
# enabled: false        # absent = disabled; an EXPLICIT false also suppresses
#                       # chains[i] auto-enable (operator override)
# chain-id: "my-app-chain"
# signing-key: "<hex 32-byte Ed25519 seed>"           # this member's private key
# members: "<hex pubkey1>,<hex pubkey2>"              # group member public keys
# peers: "host1:13337,host2:13337"                    # app-group peers
# max-message-bytes: 65536
# max-ttl-seconds: 3600
# default-ttl-seconds: 600
# Sequenced ledger (omit sequencer.proposer for diffusion-only mode):
# sequencer:
#   proposer: "<hex pubkey of the fixed sequencer>"
# threshold: 2                                        # finality cert n-of-members
# block:
#   interval-ms: 2000
#   max-messages: 500
# state-machine: ordered-log                          # built-in default app
# state:
#   commitment-profile: mpf-blake2b256-v1            # authenticated-state algorithm/profile
#   format-fingerprint: <64 lowercase hex chars>      # canonical encoding fingerprint
#   genesis-id: <64 lowercase hex chars>              # new-chain authenticated-map identity
#   l1-proof-consumption-required: true               # reject profiles not verifiable on L1
#   proof-pruning:
#     enabled: false                                  # experimental MPF-only, node-local
#     retain-heights: 10000                           # contiguous proof-generation horizon
#     interval-seconds: 3600                          # dedicated background GC cadence
# L1 anchoring (anchor wallet must be funded):
# anchor:
#   enabled: true
#   signing-key: "<hex 32-byte Ed25519 seed>"         # anchor wallet payment key
#   every-blocks: 10
#   max-interval-minutes: 60
#   metadata-label: 7014                              # metadata mode (A1) only
#   mode: metadata                                    # metadata (default) | script (ADR 008.4)
#   script:                                           # script mode (A2): threshold-signed anchor UTxO
#     validator: builtin:aiken                        # builtin:aiken | file:/path | hex:...
#     thread-policy: builtin:aiken
#   # Script mode: bootstrap once via POST /app-chain/admin/anchor/bootstrap;
#   # followers need NO anchor config — they verify + co-sign automatically.
# l1:
#   stability-depth: 36                               # L1 ref depth in app blocks
# L1 observers (ADR 008.4 I3.2): deterministic L1-fact injection on ~l1/<id>.
# MUST be configured identically on EVERY member (followers verify each
# observation against their own recomputation before voting — fail-closed):
# observation:
#   l1-network-genesis-id: "<64 hex chars>"          # required with observers
# observers:
#   deposits:
#     type: address-deposit                           # watch payments to an address
#     address: "addr_test1..."
#   registry:
#     type: metadata-label                            # watch a tx metadata label
#     label: 7014
