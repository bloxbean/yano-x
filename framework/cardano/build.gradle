description = 'Optional Cardano integration and compatible application-ledger runtime'

dependencies {
    testImplementation(testFixtures(project(':framework:core')))
    api project(':framework:core')
    api project(':framework:cardano-api')
    implementation project(':framework:host-adapter')
    // The Cardano adapter exposes Host API types in its protected factory hooks.
    api "org.yanoproject:yano-host-api:${providers.gradleProperty('hostApiVersion').get()}"

    implementation libs.cardano.client.core
    implementation libs.cardano.client.quicktx
    implementation libs.julc.cardano.client.lib
    implementation libs.jackson.databind
    implementation libs.cbor
    implementation libs.rocksdb

    // Evaluator discovery and the checked anchor identities are optional with
    // this integration. Neither belongs to the standalone framework closure.
    runtimeOnly(libs.julc.vm.java) {
        exclude group: 'com.bloxbean.cardano', module: 'cardano-client-lib'
    }
    runtimeOnly project(':framework:cardano-onchain')
    testImplementation project(':framework:config')
    // Moved runtime app-chain tests build MPF tries directly.
    testImplementation libs.cardano.client.mpf
}

tasks.named('processResources') {
    filesMatching('META-INF/yano/plugins/*.json') {
        expand(pluginVersion: project.version.toString())
    }
}

// Exercises Cardano delivery against the real selected host's chain reader and
// block builder; kept out of foundation-only frameworkCheck and unit tests.
dependencies {
    integrationTestImplementation "org.yanoproject:yano-runtime:${providers.gradleProperty('yanoVersion').get()}"
    integrationTestImplementation testFixtures(project(':framework:core'))
    // Shared runtime test helpers (state-commitment identities).
    integrationTestImplementation sourceSets.test.output
}
tasks.named('check') { dependsOn tasks.named('integrationTest') }
// The host catalog indexes the embedded application-ledger root as one artifact (manifest plus
// classes), exactly as a distribution ships it, so run against the module jar.
tasks.named('integrationTest', Test) {
    classpath = files(tasks.named('jar')) + classpath.filter { !(it in sourceSets.main.output.files) }
}
