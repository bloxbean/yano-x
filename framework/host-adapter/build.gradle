description = 'Descriptor-free application-ledger adapter to the existing Yano Host API'

dependencies {
    api project(':framework:core')
    implementation project(':framework:config')
    api "org.yanoproject:yano-host-api:${providers.gradleProperty('hostApiVersion').get()}"
}

tasks.named('processResources') {
    filesMatching('META-INF/yano/app-ledger-version.properties') {
        expand(pluginVersion: project.version.toString())
    }
}
