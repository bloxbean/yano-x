plugins {
    id 'java-library'
}

description = 'Typed Cardano History predicates over the reusable Yano MPF on-chain verifier'

dependencies {
    api project(':sdk:proof-onchain')
    api project(':state-machines:stdlib-contracts')
    api project(':composition:contracts')
    compileOnly "org.julclang:julc-stdlib:${libs.versions.julc.get()}"
    compileOnly "org.julclang:julc-ledger-api:${libs.versions.julc.get()}"

    testImplementation "org.julclang:julc-stdlib:${libs.versions.julc.get()}"
    testImplementation "org.julclang:julc-testkit:${libs.versions.julc.get()}"
    testImplementation "org.julclang:julc-ledger-api:${libs.versions.julc.get()}"
    testImplementation "org.julclang:julc-compiler:${libs.versions.julc.get()}"
    testRuntimeOnly "org.julclang:julc-vm-java:${libs.versions.julc.get()}"
    testImplementation libs.cardano.client.crypto
    testImplementation rootProject.ext.yanoModule('yano-core-api')
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.register('prepareJulcTestSources', Sync) {
    from sourceSets.main.java
    from project(':sdk:proof-onchain').sourceSets.main.java
    into layout.buildDirectory.dir('generated/julc-test-sources')
}

tasks.named('test') {
    dependsOn tasks.named('prepareJulcTestSources')
}
