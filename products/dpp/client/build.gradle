dependencies {
    api project(':products:dpp:profile')
    api project(':products:trust-registry:client')
    api project(':sdk:client')
    api project(':products:attest:client')
    implementation libs.jackson.databind
    implementation libs.cbor
    implementation libs.cardano.client.crypto

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
    testImplementation project(':state-machines:stdlib')
    testImplementation rootProject.ext.yanoModule('yano-appchain-core-testkit')
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.withType(Test).configureEach {
    // ./gradlew :products:dpp:client:test -PdppGoldenWrite=true regenerates the committed
    // golden passport bundle, members file, and disclosure for the CLI and console tests.
    systemProperty 'yano.dpp.golden.write',
            providers.gradleProperty('dppGoldenWrite').getOrElse('false')
    systemProperty 'yano.dpp.golden.dir',
            layout.projectDirectory.dir('src/test/resources/golden').asFile.absolutePath
    systemProperty 'yano.dpp.cli.golden.dir',
            rootProject.file('products/dpp/cli/src/test/resources/golden').absolutePath
    systemProperty 'yano.dpp.ui.golden.dir',
            rootProject.file('products/dpp/ui/src/lib/fixtures').absolutePath
    systemProperty 'yano.dpp.firewall.classpath',
            configurations.runtimeClasspath.asPath
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano DPP Starter Client'
                description = 'Digital Product Passport starter (prototype): governed writes, passport assembly and verification, portal and operator gateway'
            }
        }
    }
}
