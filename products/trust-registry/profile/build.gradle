dependencies {
    api project(':state-machines:stdlib-contracts')
    api project(':capabilities:role-workflow-contracts')
    implementation project(':state-machines:stdlib')
    implementation libs.jackson.databind
    implementation libs.cbor
    implementation libs.cardano.client.crypto

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.withType(Test).configureEach {
    // ADR-049 §5: the runtime classpath the firewall test scans.
    systemProperty 'yano.trust.firewall.classpath',
            configurations.runtimeClasspath.asPath
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano Trust Registry Profile'
                description = 'Trust and status registry profile, genesis generator, value codecs, and status-list projection over the governed authenticated map'
            }
        }
    }
}
