dependencies {
    api project(':products:attestation-feed:profile')
    api project(':products:trust-registry:client')
    api project(':sdk:client')
    api project(':products:attest:client')
    implementation libs.jackson.databind
    implementation libs.cbor
    implementation libs.cardano.client.crypto

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
    testImplementation project(':state-machines:stdlib')
    testImplementation rootProject.ext.yanoModule('yano-appchain-core-testkit')
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.withType(Test).configureEach {
    // ./gradlew :products:attestation-feed:client:test -PfeedGoldenWrite=true regenerates the
    // committed golden round bundle, members file, and round request for the CLI and console tests.
    systemProperty 'yano.feed.golden.write',
            providers.gradleProperty('feedGoldenWrite').getOrElse('false')
    systemProperty 'yano.feed.golden.dir',
            layout.projectDirectory.dir('src/test/resources/golden').asFile.absolutePath
    systemProperty 'yano.feed.cli.golden.dir',
            rootProject.file('products/attestation-feed/cli/src/test/resources/golden').absolutePath
    systemProperty 'yano.feed.ui.golden.dir',
            rootProject.file('products/attestation-feed/ui/src/lib/fixtures').absolutePath
    systemProperty 'yano.feed.firewall.classpath',
            configurations.runtimeClasspath.asPath
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano Attestation Feed Starter Client'
                description = 'Data attestation feed starter (experimental): governed observations, the round-close approval round, round bundles recomputed and verified offline, the public portal and the signing gateway'
            }
        }
    }
}
