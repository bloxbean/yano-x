plugins {
    id 'application'
}

dependencies {
    implementation project(':products:attest:client')
    implementation libs.jackson.databind
    runtimeOnly libs.slf4j.nop

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

application {
    mainClass = 'org.yanoproject.x.attest.cli.AttestCli'
    applicationName = 'yano-attest'
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.withType(Test).configureEach {
    systemProperty 'yano.attest.cli.golden.dir',
            layout.projectDirectory.dir('src/test/resources/golden').asFile.absolutePath
}
