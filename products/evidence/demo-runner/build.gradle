import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import java.security.MessageDigest
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

plugins {
    id 'application'
    id 'com.gradleup.shadow'
}

// The standalone runner uses JDK HttpClient/HttpServer and the AWS SDK's
// URLConnection client. Core API model dependencies otherwise pull the full
// Yaci Netty stack into the shaded audit tool even though no Netty path is
// reachable here.
configurations.configureEach {
    exclude group: 'io.netty'
}

dependencies {
    // Standalone audit tooling: canonical effect decoding and portable
    // threshold-finality/anchor evidence verification. This executable does
    // not run inside the node and contributes no SPI.
    implementation platform(libs.jackson.bom)
    implementation project(':framework:cardano-api')
    implementation project(':products:evidence:client')
    implementation project(':products:evidence:contracts')
    implementation project(':composition:contracts')
    implementation project(':capabilities:role-workflow-contracts')
    implementation libs.cardano.client.crypto
    implementation project(':sdk:integration-contracts')
    implementation libs.jackson.databind
    implementation libs.kafka.clients
    implementation(libs.aws.sdk.s3) {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache5-client'
    }
    implementation libs.aws.sdk.url.connection.client

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

application {
    mainClass = 'org.yanoproject.x.examples.evidence.demo.EvidenceDemoMain'
    applicationDefaultJvmArgs = ['--add-modules=jdk.httpserver']
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
    options.compilerArgs += ['--add-modules', 'jdk.httpserver']
}

tasks.named('compileTestJava') {
    options.compilerArgs += ['--add-modules', 'jdk.httpserver']
}

tasks.named('compileIntegrationTestJava') {
    options.compilerArgs += ['--add-modules', 'jdk.httpserver']
}

tasks.withType(Test).configureEach {
    jvmArgs '--add-modules=jdk.httpserver'
    [
            'yano.s3.bootstrap.integration.enabled',
            'yano.s3.bootstrap.integration.endpoint',
            'yano.s3.bootstrap.integration.access-key-file',
            'yano.s3.bootstrap.integration.secret-key-file',
            'yano.kafka.audit.integration.enabled',
            'yano.kafka.audit.integration.bootstrap',
            'yano.kafka.audit.integration.topic'
    ].each { key ->
        def value = System.getProperty(key)
        if (value != null) {
            systemProperty key, value
        }
    }
}

tasks.named('shadowJar') {
    archiveBaseName.set(rootProject.ext.artifactByPath[project.path].artifactId.toString())
    archiveClassifier.set('all')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

def pluginMetadataPrefixes = [
        'META-INF/yano/plugins/',
        'META-INF/services/org.yanoproject.api.',
        'META-INF/services/org.yanoproject.x.framework.api.',
        'META-INF/services/org.yanoproject.x.framework.cardano.api.'
]
def forbiddenClassPrefixes = [
        'org/yanoproject/runtime/',
        'org/yanoproject/x/framework/runtime/',
        'org/yanoproject/x/framework/host/',
        'org/yanoproject/x/framework/cardano/',
        'org/yanoproject/x/framework/standalone/',
        'org/yanoproject/x/kafka/',
        'org/yanoproject/x/ipfs/',
        'org/yanoproject/x/objectstore/s3/'
]

// Public node contracts retain host runtime package names. Admit only the exact
// resolved node API bytes; framework contracts have their own explicit API packages.
def boundaryClassHashes = { File artifact ->
    new ZipFile(artifact).withCloseable { zip ->
        zip.entries().findAll { entry ->
            !entry.directory && entry.name.endsWith('.class')
                    && forbiddenClassPrefixes.any { entry.name.startsWith(it) }
                    && !entry.name.startsWith('org/yanoproject/x/framework/cardano/api/')
        }.collectEntries { entry ->
            [(entry.name): zip.getInputStream(entry).withCloseable { stream ->
                MessageDigest.getInstance('SHA-256').digest(stream.bytes).encodeHex().toString()
            }]
        }
    }
}
def publicContractHashes = {
    def artifacts = configurations.runtimeClasspath.incoming.artifacts.artifacts
    def owners = artifacts.findAll {
        def id = it.id.componentIdentifier
        id instanceof ModuleComponentIdentifier && id.group == 'org.yanoproject'
                && id.module == 'yano-node-api'
    }
    if (owners.size() != 1) {
        throw new GradleException('Demo runner must resolve exactly one yano-node-api contract owner')
    }
    boundaryClassHashes(owners.first().file)
            .findAll { name, hash -> name.startsWith('org/yanoproject/runtime/') }
}
def implementationClasses = { Map classes, Map apiContracts ->
    classes.findAll { name, hash -> !apiContracts.containsKey(name) || apiContracts[name] != hash }.keySet()
}

tasks.register('verifyDemoRunnerBoundaryContract') {
    group = 'verification'
    description = 'Checks exact API ownership while rejecting real runtime and connector implementations.'
    def coreJar = project(':framework:core').tasks.named('jar')
    def connectorJar = project(':connectors:kafka').tasks.named('jar')
    def adapterJar = project(':framework:host-adapter').tasks.named('jar')
    def cardanoJar = project(':framework:cardano').tasks.named('jar')
    def cardanoApiJar = project(':framework:cardano-api').tasks.named('jar')
    dependsOn coreJar, connectorJar, adapterJar, cardanoJar, cardanoApiJar
    inputs.files(configurations.runtimeClasspath)
    inputs.files(coreJar.flatMap { it.archiveFile }, connectorJar.flatMap { it.archiveFile },
            adapterJar.flatMap { it.archiveFile }, cardanoJar.flatMap { it.archiveFile },
            cardanoApiJar.flatMap { it.archiveFile })
    doLast {
        def contracts = publicContractHashes()
        assert contracts.containsKey('org/yanoproject/runtime/kernel/Subsystem.class')
        def cardanoApi = cardanoApiJar.get().archiveFile.get().asFile
        new ZipFile(cardanoApi).withCloseable { zip ->
            assert zip.getEntry('org/yanoproject/x/framework/cardano/api/CardanoRuntimeServices.class') != null
        }
        assert boundaryClassHashes(cardanoApi).isEmpty()
        assert implementationClasses(contracts, contracts).isEmpty()
        assert implementationClasses(boundaryClassHashes(coreJar.get().archiveFile.get().asFile), contracts)
                .contains('org/yanoproject/x/framework/runtime/appchain/AppLedgerRuntime.class')
        assert implementationClasses(boundaryClassHashes(connectorJar.get().archiveFile.get().asFile), contracts)
                .any { it.startsWith('org/yanoproject/x/kafka/') }
        assert implementationClasses(boundaryClassHashes(adapterJar.get().archiveFile.get().asFile), contracts)
                .contains('org/yanoproject/x/framework/host/AppLedgerHostPlugin.class')
        assert implementationClasses(boundaryClassHashes(cardanoJar.get().archiveFile.get().asFile), contracts)
                .contains('org/yanoproject/x/framework/cardano/CardanoAppLedgerPlugin.class')
        // A familiar public name must not hide replacement implementation bytes.
        def name = contracts.keySet().first()
        def forged = new File(temporaryDir, 'replaced-api.jar')
        forged.parentFile.mkdirs()
        new ZipOutputStream(new FileOutputStream(forged)).withCloseable { zip ->
            zip.putNextEntry(new ZipEntry(name))
            zip.write('replacement implementation'.getBytes('UTF-8'))
            zip.closeEntry()
        }
        assert implementationClasses(boundaryClassHashes(forged), contracts).contains(name)
        logger.lifecycle('Verified exact public API ownership and runtime/adapter/connector/replacement rejection')
    }
}

tasks.register('verifyDemoRunnerArtifactBoundary') {
    group = 'verification'
    description = 'Verifies that the demo runner cannot activate or embed Yano plugin/runtime implementations'
    dependsOn tasks.named('verifyDemoRunnerBoundaryContract')
    dependsOn rootProject.tasks.named('verifyAdr013JacksonAlignment'),
            rootProject.tasks.named('verifyAdr013Slf4jAlignment')
    dependsOn tasks.named('jar'), tasks.named('shadowJar')
    inputs.files(tasks.named('jar').flatMap { it.archiveFile },
            tasks.named('shadowJar').flatMap { it.archiveFile })
    inputs.files(configurations.runtimeClasspath)

    doLast {
        def entryNames = { File artifact ->
            if (artifact.isDirectory()) {
                def root = artifact.toPath()
                def names = [] as Set
                artifact.eachFileRecurse { candidate ->
                    if (candidate.isFile()) {
                        names.add(root.relativize(candidate.toPath()).toString()
                                .replace(File.separatorChar, '/' as char))
                    }
                }
                return names
            }
            if (!artifact.name.endsWith('.jar')) {
                return [] as Set
            }
            return new ZipFile(artifact).withCloseable { zip ->
                zip.entries().collect { entry -> entry.name }.toSet()
            }
        }
        def apiContracts = publicContractHashes()
        [tasks.named('jar').get().archiveFile.get().asFile,
         tasks.named('shadowJar').get().archiveFile.get().asFile].each { artifact ->
            def entries = entryNames(artifact)
            if (entries.any { name -> pluginMetadataPrefixes.any { name.startsWith(it) } }) {
                throw new GradleException("Demo runner contains plugin metadata: ${artifact.name}")
            }
            def implementations = implementationClasses(boundaryClassHashes(artifact), apiContracts)
            if (!implementations.isEmpty()) {
                throw new GradleException("Demo runner embeds a plugin/runtime implementation: "
                        + "${artifact.name}: ${implementations.sort()}")
            }
        }

        def forbiddenProjects = [
                ':runtime', ':framework:core', ':framework:cardano', ':framework:host-adapter',
                ':framework:standalone', ':products:evidence:registry', ':products:evidence:profile',
                ':composition:runtime', ':state-machines:stdlib', ':capabilities:role-workflow', ':connectors:kafka',
                ':connectors:objectstore-s3', ':connectors:ipfs'
        ] as Set
        def forbidden = configurations.runtimeClasspath.incoming.resolutionResult.allComponents
                .findAll { component ->
                    component.id instanceof
                            org.gradle.api.artifacts.component.ProjectComponentIdentifier
                            && forbiddenProjects.contains(component.id.projectPath)
                }
        if (!forbidden.isEmpty()) {
            throw new GradleException('Demo runner dependency closure contains plugin/runtime projects: '
                    + forbidden.collect { it.id.projectPath }.sort().join(', '))
        }
        def forbiddenNetty = configurations.runtimeClasspath.incoming.resolutionResult.allComponents
                .findAll { component ->
                    component.moduleVersion != null
                            && component.moduleVersion.group == 'io.netty'
                }
        if (!forbiddenNetty.isEmpty()) {
            throw new GradleException('Demo runner dependency closure contains unused Netty modules: '
                    + forbiddenNetty.collect { it.moduleVersion.toString() }.sort().join(', '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDemoRunnerArtifactBoundary')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano App-Chain Evidence Demo Runner'
                description = 'Credential-safe no-code runner and report UI for the ADR-013 evidence scenario'
            }
        }
    }
}
