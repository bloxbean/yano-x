import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.zip.ZipFile

def inventory = new JsonSlurper().parse(
        rootProject.file('config/artifacts-v1.json'))
def runtimeBundleSpecifications = inventory.artifacts.findAll { artifact ->
    artifact.publicationType == 'runtime-plugin'
}
def distributionSelectionFile = rootProject.file('config/jvm-distribution-v1.json')
def distributionSelection = new JsonSlurper().parse(distributionSelectionFile)
def runtimeBundleIds = runtimeBundleSpecifications*.pluginBundleId as Set
def defaultBundleIds = distributionSelection.defaultBundleIds as Set
def optionalBundleIds = distributionSelection.optionalBundleIds as Set
if (distributionSelection.schemaVersion != 1
        || defaultBundleIds.intersect(optionalBundleIds)
        || defaultBundleIds + optionalBundleIds != runtimeBundleIds) {
    throw new GradleException(
            "Invalid JVM distribution bundle selection: ${distributionSelection}")
}
def bundleInstallMode = { specification ->
    defaultBundleIds.contains(specification.pluginBundleId) ? 'default' : 'optional'
}
def canonicalBundleFileName = { specification ->
    "${specification.bundleArtifactId}-${project.version}.jar"
}
def bundleSpecificationsByArtifactNameLength =
        runtimeBundleSpecifications.toSorted { left, right ->
            right.bundleArtifactId.toString().length() <=>
                    left.bundleArtifactId.toString().length()
        }
def canonicalBundleNameForResolvedFile = { String resolvedName ->
    def specification = bundleSpecificationsByArtifactNameLength.find { candidate ->
        resolvedName.startsWith("${candidate.bundleArtifactId}-")
    }
    if (specification == null) {
        throw new GradleException(
                "Resolved plugin bundle has no artifact inventory entry: ${resolvedName}")
    }
    canonicalBundleFileName(specification)
}
def packVersion = project.version.toString().replaceAll('-SNAPSHOT', '')
def generatedPackManifest = layout.buildDirectory.file(
        'generated/distribution/plugin-pack/yano-x-plugin-pack-v1.json')
def aggregateSbom = rootProject.ext.yanoXAggregateSbomJson
def releaseSbom = layout.buildDirectory.file(
        'generated/distribution/sbom/yano-x.cdx.json')

configurations.create('yanoExtensionBundles') {
    canBeConsumed = false
    canBeResolved = true
    description = 'Dependency-complete Yano X runtime plugin bundles'
}
configurations.create('yanoDefaultExtensionBundles') {
    canBeConsumed = false
    canBeResolved = true
    description = 'Conflict-free Yano X bundles installed in the JVM plugin directory'
}
configurations.create('yanoOptionalExtensionBundles') {
    canBeConsumed = false
    canBeResolved = true
    description = 'Alternative Yano X bundles shipped outside the active plugin directory'
}

dependencies {
    runtimeBundleSpecifications.each { specification ->
        def coordinate =
                "${inventory.group}:${specification.bundleArtifactId}:${project.version}"
        yanoExtensionBundles(coordinate)
        if (bundleInstallMode(specification) == 'default') {
            yanoDefaultExtensionBundles(coordinate)
        } else {
            yanoOptionalExtensionBundles(coordinate)
        }
    }
}

def fileSha256 = { File input ->
    def digest = MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[64 * 1024]
        int count
        while ((count = stream.read(buffer)) >= 0) {
            if (count > 0) {
                digest.update(buffer, 0, count)
            }
        }
    }
    digest.digest().encodeHex().toString()
}

tasks.register('normalizeYanoXReleaseSbom') {
    dependsOn rootProject.tasks.named('cyclonedxBom')
    group = 'distribution'
    description = 'Normalizes and license-checks the Yano X CycloneDX release SBOM.'
    inputs.file(aggregateSbom)
    inputs.file(rootProject.file('LICENSE'))
    outputs.file(releaseSbom)

    doLast {
        def body = new JsonSlurper().parse(aggregateSbom.get().asFile)
        if (body.bomFormat != 'CycloneDX' || body.specVersion != '1.6'
                || body.metadata?.component?.name != 'yano-x'
                || body.metadata.component.version != project.version.toString()
                || !(body.components instanceof Collection)
                || body.components.isEmpty()) {
            throw new GradleException('Yano X aggregate SBOM identity is incomplete')
        }
        body.remove('serialNumber')
        body.metadata.remove('timestamp')
        def mitLicense = [[license: [id: 'MIT']]]
        def repositoryReference = [[
                type: 'vcs',
                url: 'https://github.com/bloxbean/yano-x.git'
        ]]
        body.metadata.component.remove('licenses')
        body.metadata.component.remove('externalReferences')
        body.metadata.component.licenses = mitLicense
        body.metadata.component.externalReferences = repositoryReference
        body.components.findAll { component ->
            component.group?.toString()?.startsWith('com.bloxbean.cardano')
        }.each { component ->
            component.remove('licenses')
            component.remove('externalReferences')
            component.licenses = mitLicense
            component.externalReferences = repositoryReference
        }
        def externalWithoutLicense = body.components.findAll { component ->
            !component.group?.toString()?.startsWith('com.bloxbean.cardano')
                    && (!(component.licenses instanceof Collection)
                    || component.licenses.isEmpty())
        }.collect { component ->
            "${component.group}:${component.name}:${component.version}"
        }.sort()
        if (!externalWithoutLicense.isEmpty()) {
            throw new GradleException(
                    'External SBOM components lack license metadata: '
                            + externalWithoutLicense)
        }
        def output = releaseSbom.get().asFile
        output.parentFile.mkdirs()
        output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(body)) + '\n', 'UTF-8')
    }
}

tasks.register('generatePluginPackManifest') {
    group = 'distribution'
    description = 'Validates runtime bundles and writes the plugin-pack manifest.'
    inputs.files(configurations.yanoExtensionBundles)
    inputs.property('yanoXVersion', project.version.toString())
    outputs.file(generatedPackManifest)

    doLast {
        def expected = runtimeBundleSpecifications.collectEntries { specification ->
            [(specification.bundleArtifactId.toString()): specification]
        }
        def resolved = configurations.yanoExtensionBundles.resolvedConfiguration
                .resolvedArtifacts.findAll { artifact ->
            artifact.moduleVersion.id.group == inventory.group
        }
        def byArtifactId = resolved.groupBy { artifact ->
            artifact.moduleVersion.id.name
        }
        def failures = []
        expected.each { artifactId, ignored ->
            def candidates = byArtifactId[artifactId] ?: []
            if (candidates.size() != 1) {
                failures.add("${artifactId} resolved ${candidates.size()} artifacts")
            }
        }
        def unexpected = byArtifactId.keySet().findAll { artifactId ->
            !expected.containsKey(artifactId)
        }
        if (!unexpected.isEmpty()) {
            failures.add("Unexpected bundle artifacts: ${unexpected.sort()}")
        }
        if (!failures.isEmpty()) {
            throw new GradleException('Yano X bundle resolution failed:\n - '
                    + failures.join('\n - '))
        }

        def bundles = expected.collect { artifactId, specification ->
            def artifact = byArtifactId[artifactId].first()
            def manifests = []
            new ZipFile(artifact.file).withCloseable { archive ->
                archive.entries().findAll { entry ->
                    entry.name.startsWith('META-INF/yano/plugins/')
                            && entry.name.endsWith('.json')
                }.each { entry ->
                    manifests.add(archive.getInputStream(entry).withCloseable { stream ->
                        new JsonSlurper().parse(stream)
                    })
                }
            }
            if (manifests.size() != 1) {
                throw new GradleException(
                        "${artifactId} must contain exactly one plugin manifest")
            }
            def manifest = manifests.first()
            if (manifest.id != specification.pluginBundleId
                    || manifest.version != project.version.toString()) {
                throw new GradleException(
                        "${artifactId} plugin identity mismatch: ${manifest}")
            }
            [
                    artifactId: artifactId,
                    bundleId: specification.pluginBundleId,
                    version: artifact.moduleVersion.id.version,
                    file: canonicalBundleFileName(specification),
                    sha256: fileSha256(artifact.file),
                    installMode: bundleInstallMode(specification),
                    dependencies: (manifest.dependencies ?: []).collect { dependency ->
                        dependency.id.toString()
                    }.sort(),
                    contributions: (manifest.contributions ?: []).collect { contribution ->
                        "${contribution.kind}/${contribution.name}"
                    }.sort()
            ]
        }.sort { left, right -> left.bundleId <=> right.bundleId }

        def defaultBundles = bundles.findAll { bundle ->
            bundle.installMode == 'default'
        }
        def selectedBundleIds = defaultBundles*.bundleId as Set
        def missingDependencies = defaultBundles.collectMany { bundle ->
            bundle.dependencies.findAll { dependency ->
                !selectedBundleIds.contains(dependency)
            }.collect { dependency -> "${bundle.bundleId}->${dependency}" }
        }
        def duplicateContributions = defaultBundles.collectMany { bundle ->
            bundle.contributions.collect { contribution ->
                [identity: contribution, bundleId: bundle.bundleId]
            }
        }.groupBy { contribution -> contribution.identity }
                .findAll { ignored, owners -> owners.size() > 1 }
                .collect { identity, owners ->
                    "${identity}:${owners*.bundleId.sort()}"
                }
        if (!missingDependencies.isEmpty() || !duplicateContributions.isEmpty()) {
            throw new GradleException(
                    'Yano X default plugin selection is not activatable:'
                            + " missingDependencies=${missingDependencies.sort()},"
                            + " duplicateContributions=${duplicateContributions.sort()}")
        }

        def output = generatedPackManifest.get().asFile
        output.parentFile.mkdirs()
        output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                schemaVersion: 1,
                product: 'yano-x',
                version: project.version.toString(),
                bundles: bundles
        ])) + '\n', 'UTF-8')
    }
}

tasks.register('yanoXPluginPackZip', Zip) {
    dependsOn tasks.named('generatePluginPackManifest'),
            tasks.named('normalizeYanoXReleaseSbom')
    group = 'distribution'
    description = 'Creates the versioned Yano X runtime plugin pack.'
    archiveFileName = "yano-x-plugin-pack-${packVersion}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    reproducibleFileOrder = true
    preserveFileTimestamps = false

    into("yano-x-plugin-pack-${packVersion}") {
        from(rootProject.file('LICENSE'))
        from(releaseSbom) {
            into 'sbom'
        }
        from(generatedPackManifest)
        from(configurations.yanoDefaultExtensionBundles) {
            into 'plugins'
            rename { name -> canonicalBundleNameForResolvedFile(name) }
        }
        from(configurations.yanoOptionalExtensionBundles) {
            into 'optional-plugins'
            rename { name -> canonicalBundleNameForResolvedFile(name) }
        }
    }
}

ext.yanoXRuntimeBundleSpecifications = runtimeBundleSpecifications
ext.yanoXDefaultBundleIds = defaultBundleIds
ext.yanoXOptionalBundleIds = optionalBundleIds
ext.yanoXPluginPackManifest = generatedPackManifest
ext.yanoXReleaseSbom = releaseSbom
ext.yanoXFileSha256 = fileSha256
ext.yanoXCanonicalBundleName = canonicalBundleNameForResolvedFile
