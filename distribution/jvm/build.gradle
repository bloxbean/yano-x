import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.jar.JarInputStream
import java.util.zip.ZipFile

plugins {
    id 'java'
    id 'io.quarkus' version "${quarkusPluginVersion}"
}

// ADR-064 D8: the integrated Yano + Yano X application. A small Quarkus application composed from
// Yano's published yano-app-core and runtime with the Yano X framework and its REST surface; it
// builds the integrated yano.jar, which the JVM ZIP below ships in place of Yano's own.
description = 'Integrated Yano X application and JVM distribution assembly boundary'

def yanoVersion = providers.gradleProperty('yanoVersion')
def explicitHostApiVersion = providers.gradleProperty('hostApiVersion')
apply from: file('yano-input-versions.gradle')
apply from: file('src/test/yano-input-version-contract.gradle')
def configuredYanoJvmDist = providers.gradleProperty('yanoJvmDist').map { file(it) }
def isSnapshotYano = yanoVersion.getOrElse('').endsWith('-SNAPSHOT')
// A Yano commit snapshot names its Maven version <base>-<commit>-SNAPSHOT and
// its JVM ZIP yano-<base>-<commit>.zip, whose root is yano-<base>-<commit>/.
def yanoDistributionVersion = yanoVersion.getOrElse('unspecified') - ~/-SNAPSHOT$/

apply from: rootProject.file('gradle/plugin-index.gradle')

// The executable dependency rules of Yano's own app (app/build.gradle).
def jacksonPatchVersion = libs.versions.jackson.get()
def jacksonAnnotationsVersion = jacksonPatchVersion.replaceFirst(/\.\d+$/, '')
def cardanoClientLibVersion = libs.versions.cardano.client.lib.get()

configurations.configureEach {
    // Quarkus owns the application logging provider on one SLF4J API.
    exclude group: 'org.slf4j', module: 'slf4j-reload4j'
    exclude group: 'ch.qos.reload4j', module: 'reload4j'
    resolutionStrategy.force(libs.slf4j.api.get())
    resolutionStrategy.eachDependency { details ->
        def group = details.requested.group
        // The Quarkus platform selects a vulnerable Jackson patch; align every Jackson family to the
        // reviewed line (jackson-annotations follows Jackson's BOM convention without a patch component).
        if (group == 'com.fasterxml.jackson' || group?.startsWith('com.fasterxml.jackson.')) {
            details.useVersion(details.requested.name == 'jackson-annotations'
                    ? jacksonAnnotationsVersion : jacksonPatchVersion)
            details.because('ADR-013 release image requires the fixed Jackson family')
        }
        // One executable carries one cardano-client-lib family, the catalog's.
        if (group == 'com.bloxbean.cardano' && details.requested.name.startsWith('cardano-client-')) {
            details.useVersion(cardanoClientLibVersion)
            details.because('the executable aligns the cardano-client-lib family to the catalog version')
        }
    }
}

dependencies {
    implementation enforcedPlatform(
            "${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation project(':framework:rest')
    // The Cardano activation root serves both yano.mode=cardano and app-ledger, as in the baseline
    // integrated jar; the standalone root is a mutually exclusive alternative and is not composed.
    runtimeOnly project(':framework:cardano')

    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation libs.junit.jupiter.api
    testImplementation libs.assertj.core
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
}

registerPluginIndex([
        'org.yanoproject.plugins.logging': 'org.yanoproject:yano-runtime',
        'org.yanoproject.x.app-ledger': ':framework:cardano'
])

// The node identifies as the Yano release it runs, as the baseline integrated jar did.
quarkus {
    set('application.name', 'yano')
    set('application.version', yanoVersion.getOrElse('unspecified'))
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('test') {
    useJUnitPlatform()
}

def integratedYanoJar = layout.buildDirectory.file('yano.jar')
ext.yanoXIntegratedJar = integratedYanoJar

configurations {
    yanoHostRuntime {
        canBeConsumed = false
        canBeResolved = true
        description = 'Published Yano host artifacts aligned by yano-bom'
        // Select the same JVM runtime variants as the application's runtimeClasspath.
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
    yanoReleaseJvmDist {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
        description = 'Ordinary Yano JVM ZIP from the matching GitHub release'
    }
    yanoSnapshotJvmDist {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
        description = 'Ordinary Yano JVM ZIP and manifest of the matching BloxBean commit snapshot'
    }
}

// Each Yano ZIP coordinate is fetched only from its own repository: these
// groups are local names, so no other repository may answer for them.
def yanoDistributionRepository = { String repositoryName, String repositoryUrl, String pattern ->
    repositories.ivy {
        name = repositoryName
        url = uri(repositoryUrl)
        patternLayout {
            artifact pattern
        }
        metadataSources {
            artifact()
        }
    }
}
repositories {
    exclusiveContent {
        forRepositories(yanoDistributionRepository('yanoGitHubReleases',
                'https://github.com/bloxbean/yano/releases/download', 'v[revision]/[artifact]-[revision].[ext]'))
        filter { includeModule 'org.yanoproject-release', 'yano' }
    }
    // BloxBean snapshot distributions (bloxbean/yano bloxbean-snapshot-dist.yml):
    // <version>/yano-<version>.zip beside the manifest.json that lists its
    // SHA-256. A published version directory is never overwritten.
    exclusiveContent {
        forRepositories(yanoDistributionRepository('yanoBloxBeanSnapshotDistributions',
                'https://repo.bloxbean.org/dist/snapshots/yano', '[revision]/[artifact]-[revision].[ext]'))
        filter { includeModule 'org.yanoproject-snapshot', 'yano' }
    }
    exclusiveContent {
        forRepositories(yanoDistributionRepository('yanoBloxBeanSnapshotManifests',
                'https://repo.bloxbean.org/dist/snapshots/yano', '[revision]/[artifact].[ext]'))
        filter { includeModule 'org.yanoproject-snapshot', 'manifest' }
    }
}

dependencies {
    // This non-consumable qualification graph must describe the exact composed host,
    // even when the retained Host API's foundation version sorts above this host.
    yanoHostRuntime enforcedPlatform(
            "org.yanoproject:yano-bom:${yanoVersion.getOrElse('unspecified')}")
    yanoHostRuntime 'org.yanoproject:yano-node-api'
    yanoHostRuntime 'org.yanoproject:yano-cardano-api'
    yanoHostRuntime 'org.yanoproject:yano-runtime'
    yanoHostRuntime 'org.yanoproject:yano-app-core'
    if (isSnapshotYano) {
        yanoSnapshotJvmDist "org.yanoproject-snapshot:yano:${yanoDistributionVersion}@zip"
        yanoSnapshotJvmDist "org.yanoproject-snapshot:manifest:${yanoDistributionVersion}@json"
    } else {
        yanoReleaseJvmDist(
                "org.yanoproject-release:yano:"
                        + "${yanoVersion.getOrElse('unspecified')}@zip")
    }
}

def snapshotDistributionFile = { String extension ->
    configurations.yanoSnapshotJvmDist.files.find { it.name.endsWith(".${extension}") }
}
def releasedYanoJvmDist = providers.provider {
    if (!yanoVersion.isPresent()) {
        throw new GradleException('yanoVersion is required')
    }
    isSnapshotYano ? snapshotDistributionFile('zip') : configurations.yanoReleaseJvmDist.singleFile
}
def yanoJvmDist = configuredYanoJvmDist.orElse(releasedYanoJvmDist)
def yanoJvmDistSource = configuredYanoJvmDist.map { 'local-override' }
        .orElse(providers.provider { isSnapshotYano ? 'bloxbean-snapshot' : 'github-release' })
ext.yanoXBaseJvmDistribution = yanoJvmDist

// Lists every file in the integrated yano.jar. Runtime plugin bundles leave these
// out; see gradle/plugin-bundle-host-classes.gradle.
def yanoHostEntries = layout.buildDirectory.file('yano-host/yano-jar-entries.txt')
tasks.register('extractYanoHostEntries') {
    dependsOn tasks.named('quarkusBuild')
    group = 'distribution'
    description = 'Lists the files in the integrated yano.jar that runtime plugin bundles omit.'
    inputs.file(integratedYanoJar).withPropertyName('integratedYanoJar')
    outputs.file(yanoHostEntries)

    doLast {
        def names = new TreeSet<String>()
        new ZipFile(integratedYanoJar.get().asFile).withCloseable { jar ->
            jar.entries().each { entry ->
                if (!entry.directory) {
                    names.add(entry.name)
                }
            }
        }
        def output = yanoHostEntries.get().asFile
        output.parentFile.mkdirs()
        output.setText(names.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('verifyYanoInputs') {
    dependsOn tasks.named('verifyYanoInputVersionContract')
    group = 'verification'
    description = 'Resolves and verifies matching Yano Maven and JVM ZIP build identities.'
    inputs.property('yanoVersion', yanoVersion).optional(true)
    inputs.property('hostApiVersion', explicitHostApiVersion).optional(true)
    inputs.property('yanoJvmDistSource', yanoJvmDistSource)
    inputs.files(yanoJvmDist).withPropertyName('yanoJvmDist').optional()
    def report = layout.buildDirectory.file('reports/yano-inputs.json')
    outputs.file(report)

    doLast {
        if (!yanoVersion.isPresent()) {
            throw new GradleException('yanoVersion is required')
        }
        def expectedVersion = yanoVersion.get()
        def distribution = yanoJvmDist.get()
        if (!distribution.isFile()) {
            throw new GradleException("yanoJvmDist is not a file: ${distribution}")
        }

        def yanoComponents = configurations.yanoHostRuntime.incoming
                .resolutionResult.allComponents.findAll { component ->
                    component.id instanceof
                            org.gradle.api.artifacts.component.ModuleComponentIdentifier
                            && component.id.group == 'org.yanoproject'
                            && component.id.module.startsWith('yano-')
                }.collect { component ->
                    def id = component.id as
                            org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    [module: id.module, version: id.version]
                }.sort { left, right -> left.module <=> right.module }
        def bom = configurations.yanoHostRuntime.incoming.resolutionResult.allComponents.find {
            it.moduleVersion?.group == 'org.yanoproject' && it.moduleVersion?.name == 'yano-bom'
                    && it.moduleVersion?.version == expectedVersion
        }
        def hostApiConstraints = bom?.dependencies?.findAll {
            it.constraint && it.requested instanceof org.gradle.api.artifacts.component.ModuleComponentSelector
                    && it.requested.group == 'org.yanoproject' && it.requested.module == 'yano-host-api'
        }?.collect { it.requested.version }?.unique() ?: []
        if (hostApiConstraints.size() > 1) {
            throw new GradleException("Ambiguous Host API versions in Yano BOM: ${hostApiConstraints}")
        }
        def expectedHostApiVersion = validateYanoArtifactVersions(yanoComponents, expectedVersion,
                hostApiConstraints ? hostApiConstraints.first() : null, explicitHostApiVersion.orNull)
        def requiredModules = [
                'yano-bom',
                'yano-node-api',
                'yano-cardano-api',
                'yano-runtime',
                'yano-app-core'
        ] as Set
        def missingModules = requiredModules - (yanoComponents*.module as Set)
        if (!missingModules.isEmpty()) {
            throw new GradleException(
                    "Required Yano artifacts were not resolved: ${missingModules.sort()}")
        }
        // The integrated application must ship exactly the qualified host artifacts.
        def shippedComponents = configurations.runtimeClasspath.incoming.resolutionResult.allComponents.findAll {
            it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    && it.id.group == 'org.yanoproject'
        }.collect { [module: it.id.module, version: it.id.version] }
        def unqualified = shippedComponents - yanoComponents
        if (!unqualified.isEmpty()) {
            throw new GradleException("Integrated application ships unqualified Yano artifacts: ${unqualified}")
        }

        def distributionVersion = expectedVersion.endsWith('-SNAPSHOT')
                ? expectedVersion.substring(
                        0, expectedVersion.length() - '-SNAPSHOT'.length())
                : expectedVersion
        def expectedRoot = "yano-${distributionVersion}"
        def roots
        def implementationVersion
        def distributionManifest
        new ZipFile(distribution).withCloseable { archive ->
            roots = archive.entries().collect { entry ->
                entry.name.tokenize('/').find()
            }.findAll { it != null }.toSet()
            if (roots != [expectedRoot] as Set) {
                throw new GradleException(
                        "yanoJvmDist root ${roots.sort()} does not match ${expectedRoot}")
            }
            def runtimeEntry = archive.getEntry("${expectedRoot}/yano.jar")
            if (runtimeEntry == null) {
                throw new GradleException(
                        "yanoJvmDist does not contain ${expectedRoot}/yano.jar")
            }
            new JarInputStream(archive.getInputStream(runtimeEntry)).withCloseable { runtimeJar ->
                implementationVersion = runtimeJar.manifest?.mainAttributes
                        ?.getValue('Implementation-Version')
            }
            def manifestEntry = archive.getEntry(
                    "${expectedRoot}/yano-distribution-v1.json")
            if (manifestEntry == null) {
                throw new GradleException(
                        'yanoJvmDist does not contain yano-distribution-v1.json')
            }
            distributionManifest = archive.getInputStream(manifestEntry)
                    .withCloseable { stream -> new JsonSlurper().parse(stream) }
        }
        if (implementationVersion != expectedVersion) {
            throw new GradleException(
                    "yano.jar Implementation-Version ${implementationVersion} "
                            + "does not match ${expectedVersion}")
        }
        // builtInStateMachines describes Yano's own yano.jar, which the integrated jar replaces;
        // verifyYanoXJvmDistribution checks what the integrated jar contains.
        def expectedDistributionManifest = [
                schemaVersion: 1,
                product: 'yano',
                distribution: 'core-jvm',
                version: expectedVersion,
                pluginDirectorySupported: true
        ]
        if (distributionManifest.findAll { it.key != 'builtInStateMachines' } != expectedDistributionManifest) {
            throw new GradleException(
                    "Unexpected Yano distribution contract: ${distributionManifest}")
        }

        def digest = MessageDigest.getInstance('SHA-256')
        distribution.withInputStream { stream ->
            byte[] buffer = new byte[64 * 1024]
            int count
            while ((count = stream.read(buffer)) >= 0) {
                if (count > 0) {
                    digest.update(buffer, 0, count)
                }
            }
        }
        def distributionSha256 = digest.digest().encodeHex().toString()
        if (yanoJvmDistSource.get() == 'bloxbean-snapshot') {
            def snapshotManifest = new JsonSlurper().parse(snapshotDistributionFile('json'))
            def listed = snapshotManifest.files?.find { it.name == distribution.name }
            if (snapshotManifest.version != distributionVersion || listed?.sha256 != distributionSha256) {
                throw new GradleException(
                        "Yano snapshot ZIP ${distribution.name} (sha256 ${distributionSha256}) "
                                + "does not match its published manifest.json")
            }
        }
        def body = [
                schemaVersion: 1,
                yanoVersion: expectedVersion,
                hostApiVersion: expectedHostApiVersion,
                distributionRoot: expectedRoot,
                distributionImplementationVersion: implementationVersion,
                distributionContract: distributionManifest,
                distributionSha256: distributionSha256,
                distributionSource: yanoJvmDistSource.get(),
                resolvedArtifacts: yanoComponents
        ]
        def output = report.get().asFile
        output.parentFile.mkdirs()
        output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(body)) + '\n', 'UTF-8')
        logger.lifecycle(
                'Verified Yano {} against {} published artifacts and JVM ZIP {} ({})',
                expectedVersion, yanoComponents.size(), distribution.name,
                yanoJvmDistSource.get())
    }
}

apply from: file('plugin-pack.gradle')
apply from: file('jvm-distribution.gradle')

tasks.named('check') {
    dependsOn tasks.named('verifyYanoXJvmDistribution')
}
