            '-Dyano.app-chain.effects.executor.identity=conformance-smoke',
            '-Dyano.app-chain.effects.executors.conformance-effect.enabled=true'
    ].collect { it.toString() }
}

// One HTTP exchange against the packaged process; returns status, body text and lower-cased headers.
def httpRequest = { int httpPort, String method, String path, String contentType, byte[] body,
                    boolean authenticated ->
    def connection = (HttpURLConnection) new URL("http://127.0.0.1:${httpPort}${path}").openConnection()
    try {
        connection.connectTimeout = 2000
        connection.readTimeout = 15000  // the first query and health samples can be slow on a loaded CI host
        connection.requestMethod = method
        if (authenticated) connection.setRequestProperty('X-API-Key', pluginOperationsSmokeApiKey)
        if (body != null) {
            connection.doOutput = true
            connection.setRequestProperty('Content-Type', contentType)
            connection.outputStream.withCloseable { it.write(body) }
        }
        int status = connection.responseCode
        def stream = status >= 400 ? connection.errorStream : connection.inputStream
        byte[] responseBody = stream != null ? stream.withCloseable { it.readAllBytes() } : new byte[0]
        def headers = connection.headerFields.findAll { key, ignored -> key != null }
                .collectEntries { key, values -> [key.toLowerCase(Locale.ROOT), values.join(',')] }
        return [status: status, text: new String(responseBody, java.nio.charset.StandardCharsets.UTF_8),
                headers: headers]
    } finally {
        connection.disconnect()
    }
}

def awaitPluginConformanceStatus = { int httpPort, String apiPath, int timeoutSeconds, Process process,
                                     Closure<String> logTail ->
    long deadline = System.nanoTime() + java.util.concurrent.TimeUnit.SECONDS.toNanos(timeoutSeconds)
    Map status = null
    String lastResponse = ''
    while (status == null && System.nanoTime() < deadline && process.isAlive()) {
        try {
            def response = httpRequest(httpPort, 'GET',
                    apiPath + '/app-chain/chains/conformance-chain/status', null, null, true)
            lastResponse = response.text
            if (response.status == 200) {
                def parsed = new JsonSlurper().parseText(lastResponse)
                if (parsed instanceof Map && parsed.running == true) status = parsed as Map
            }
        } catch (IOException ignored) {
            // Runtime/app-chain startup is still in progress.
        }
        if (status == null) Thread.sleep(100)
    }
    if (status == null) {
        def state = process.isAlive() ? 'did not publish running status' : "exited with code ${process.exitValue()}"
        throw new GradleException("Plugin conformance app chain ${state}; lastResponse=${lastResponse}."
                + "${System.lineSeparator()}${logTail.call()}")
    }
    def failures = []
    if (status.chainId != 'conformance-chain') failures.add('chainId')
    if (status.sequencing != true) failures.add('sequencing')
    if (status.memberKey != pluginConformanceMemberKey) failures.add('signer')
    if (status.stateMachine != 'conformance-machine') failures.add('stateMachine')
    if (!(status.sequencer instanceof Map) || status.sequencer.mode != 'conformance-mode') failures.add('sequencer')
    if (!(status.observers instanceof Map) || !status.observers.containsKey('audit')) failures.add('observer')
    if (!(status.sinks instanceof Map)
            || !(status.sinks['conformance-finalized-sink'] instanceof Map)
            || status.sinks['conformance-finalized-sink'].state != 'ACTIVE') {
        failures.add('sink')
    }
    if (status.containsKey('sinkActivationFailures')) failures.add('sinkActivationFailures')
    def executors = status.effects instanceof Map && status.effects.executor instanceof Map
            ? status.effects.executor.executors : null
    if (!(executors instanceof Collection) || Set.copyOf(executors) != Set.of('conformance-effect-executor')) {
        failures.add('effectExecutor')
    }
    if (!failures.isEmpty()) {
        throw new GradleException("Plugin conformance status failed checks ${failures}; status=${status}.")
    }
}

// The ADR-011.3 committed query and constrained domain API through the public HTTP adapter.
def assertPluginConformanceQueryApis = { int httpPort, String apiPath ->
    def utf8 = { String text -> text.getBytes(java.nio.charset.StandardCharsets.UTF_8) }
    def query = httpRequest(httpPort, 'POST', apiPath + '/app-chain/chains/conformance-chain/query/echo',
            'application/json', utf8('{"paramsHex":"00ff"}'), false)
    if (query.status != 200) {
        throw new GradleException("Committed query smoke failed: status=${query.status}, body=${query.text}")
    }
    def queryJson = new JsonSlurper().parseText(query.text)
    if (queryJson.chainId != 'conformance-chain' || queryJson.stateMachineId != 'conformance-machine'
            || !(queryJson.stateRoot ==~ /[0-9a-f]{64}/) || !(queryJson.payloadHex ==~ /[0-9a-f]+/)) {
        throw new GradleException("Committed query envelope is invalid: ${queryJson}")
    }
    def decodedPayload = new String(HexFormat.of().parseHex(queryJson.payloadHex.toString()),
            java.nio.charset.StandardCharsets.UTF_8)
    if (decodedPayload != "echo:${queryJson.committedHeight}:00ff:${queryJson.stateRoot}") {
        throw new GradleException("Committed query payload/root binding failed: ${queryJson}")
    }
    ['/query/echo;x=1', '/query/echo/'].each { alias ->
        def response = httpRequest(httpPort, 'POST', apiPath + '/app-chain/chains/conformance-chain' + alias,
                'application/json', utf8('{"paramsHex":"00ff"}'), false)
        if (response.status != 400) throw new GradleException("Query alias ${alias} was not rejected: ${response}")
    }

    def domain = "${apiPath}/plugins/${pluginConformanceBundleId}"
    def domainStatus = httpRequest(httpPort, 'GET', "${domain}/status", null, null, false)
    if (domainStatus.status != 200 || new JsonSlurper().parseText(domainStatus.text).status != 'ok') {
        throw new GradleException("Domain API status smoke failed: ${domainStatus}")
    }
    ['/status;x=1', '/status/'].each { alias ->
        def response = httpRequest(httpPort, 'GET', domain + alias, null, null, false)
        if (response.status != 404) throw new GradleException("Domain alias ${alias} was not concealed: ${response}")
    }
    def domainQuery = httpRequest(httpPort, 'POST', "${domain}/query/echo", 'application/octet-stream',
            [0, (byte) 0xff] as byte[], false)
    if (domainQuery.status != 200) throw new GradleException("Domain API query smoke failed: ${domainQuery}")
    def domainJson = new JsonSlurper().parseText(domainQuery.text)
    if (domainJson.chainId != queryJson.chainId || domainJson.stateRoot != queryJson.stateRoot
            || domainJson.payloadHex != queryJson.payloadHex) {
        throw new GradleException("Domain API query does not preserve committed query envelope: ${domainJson}")
    }
    def privileged = httpRequest(httpPort, 'GET', "${domain}/operator", null, null, false)
    if (privileged.status != 401) {
        throw new GradleException("Privileged domain route did not require its configured key: ${privileged}")
    }
    def internal = httpRequest(httpPort, 'GET', "${domain}/internal", null, null, false)
    if (internal.status != 404) throw new GradleException("Internal domain route became HTTP-visible: ${internal}")
}

// ADR-011.4's live host adapters: plugin operations, the generic console assets, the plugins
// health group and metrics, including the fixture's custom health source and counter.
def assertPluginOperationsAdapters = { int httpPort, String apiPath, String apiPrefix, int timeoutSeconds ->
    def request = { String path, boolean authenticated -> httpRequest(httpPort, 'GET', path, null, null, authenticated) }
    def unauthenticated = request(apiPath + '/plugin-operations', false)
    if (unauthenticated.status != 401) {
        throw new GradleException("Plugin operations smoke expected missing-key 401: ${unauthenticated}")
    }
    def summaryResponse = request(apiPath + '/plugin-operations', true)
    if (summaryResponse.status != 200) {
        throw new GradleException("Plugin operations summary smoke failed: ${summaryResponse}")
    }
    def summary = new JsonSlurper().parseText(summaryResponse.text)
    // Must match PluginApiVersion.CURRENT_MAJOR / CURRENT_LEVEL (node-api).
    if (!(summary.catalogFingerprint ==~ /sha256:[0-9a-f]{64}/) || summary.pluginApiMajor != 3
            || summary.pluginApiLevel != 14 || !(summary.generation instanceof Number)
            || !(summary.totals instanceof Map) || !summary.totals.containsKey('observedContributions')
            || !summary.totals.containsKey('observedActiveContributions')
            || !(summary.healthCounts instanceof Map)) {
        throw new GradleException("Plugin operations summary envelope is invalid: ${summary}")
    }
    [
            '/ui/plugins/index.html': ['Yano · Plugin Operations', 'data-console-route="plugins"',
                                       'Connect to plugin operations'],
            '/ui/plugins/api-prefix.json': [JsonOutput.toJson([apiPrefix: apiPrefix])]
    ].each { path, markers ->
        def asset = request(path, false)
        if (asset.status != 200 || !markers.every { asset.text.contains(it) }) {
            throw new GradleException("Plugin dashboard asset smoke failed for ${path}: status=${asset.status}")
        }
        def csp = asset.headers['content-security-policy']
        if (csp == null || !csp.contains("frame-ancestors 'none'") || asset.headers['x-frame-options'] != 'DENY'
                || asset.headers['x-content-type-options'] != 'nosniff'
                || asset.headers['referrer-policy'] != 'no-referrer') {
            throw new GradleException("Plugin dashboard security headers are incomplete for ${path}: ${asset.headers}")
        }
    }

    long deadline = System.nanoTime() + java.util.concurrent.TimeUnit.SECONDS.toNanos(timeoutSeconds)
    Map lastHealth = null
    Map lastDetail = null
    String lastMetrics = ''
    boolean ready = false
    while (!ready && System.nanoTime() < deadline) {
        def healthResponse = request('/q/health/group/plugins', false)
        if (healthResponse.status == 200) {
            def parsed = new JsonSlurper().parseText(healthResponse.text)
            if (parsed instanceof Map) lastHealth = parsed as Map
        }
        def metricsResponse = request('/q/metrics', false)
        if (metricsResponse.status == 200) lastMetrics = metricsResponse.text
        def detailResponse = request("${apiPath}/plugin-operations/bundles/${pluginConformanceBundleId}", true)
        if (detailResponse.status == 200) {
            def parsed = new JsonSlurper().parseText(detailResponse.text)
            if (parsed instanceof Map) lastDetail = parsed as Map
        }
        boolean healthReady = lastHealth instanceof Map && lastHealth.status == 'UP'
                && lastHealth.checks instanceof Collection
                && lastHealth.checks.any { it.name == 'plugins' && it.status == 'UP' }
        boolean standardMetricsReady = lastMetrics.contains('yano_plugin_bundles')
                && lastMetrics.contains('yano_plugin_bundle_health')
        def bundle = lastDetail?.bundle
        boolean customReady = bundle instanceof Map && bundle.health == 'UP'
                && bundle.healthChecks instanceof Collection
                && bundle.healthChecks.any {
                    it.id == 'fixture' && it.description == 'Conformance fixture is available'
                            && it.status == 'UP' && it.stale == false
                }
                && bundle.metrics instanceof Collection
                && bundle.metrics.any {
                    it.id == 'samples' && it.type == 'COUNTER' && it.stale == false
                            && it.total instanceof Number && it.total.doubleValue() >= 1d
                }
                && lastMetrics.contains('yano_plugin_custom_counter')
                && lastMetrics.contains("plugin=\"${pluginConformanceBundleId}\"")
                && lastMetrics.contains('metric="samples"')
        ready = healthReady && standardMetricsReady && customReady
        if (!ready) Thread.sleep(200)
    }
    if (!ready) {
        throw new GradleException("Plugin operations adapters did not become ready; health=${lastHealth}, "
                + "detail=${lastDetail}, metricsTail="
                + lastMetrics.readLines().takeRight(40).join(System.lineSeparator()))
    }
}

tasks.register('packagedJvmPluginCatalogSmoke') {
    group = 'verification'
    description = 'Starts the JVM ZIP\'s integrated yano.jar and activates every directory-plugin SPI on an app chain'
    def fixtureJar = project(':fixtures:appchain-plugin-conformance').tasks.named('jar', Jar).flatMap { it.archiveFile }
    dependsOn tasks.named('yanoXJvmDistZip'), ':fixtures:appchain-plugin-conformance:jar'
    inputs.file(distributionZip)
    inputs.file(fixtureJar)
    outputs.upToDateWhen { false }

    doLast {
        def smokeParent = layout.buildDirectory.dir('tmp').get().asFile
        smokeParent.mkdirs()
        def smokeRoot = java.nio.file.Files.createTempDirectory(smokeParent.toPath(), 'packaged-jvm-plugin-catalog-smoke-')
        Process process = null
        Throwable primaryFailure = null
        try {
            project.copy {
                from(project.zipTree(distributionZip.get().asFile)) {
                    include "${distributionRootName}/yano.jar", "${distributionRootName}/config/**"
                }
                into smokeRoot.toFile()
            }
            def root = smokeRoot.resolve(distributionRootName).toFile()
            def jar = new File(root, 'yano.jar')
            String apiPrefix
            new java.util.jar.JarFile(jar).withCloseable { archive ->
                def indexes = archive.entries().findAll { it.name == 'META-INF/yano-plugin-index-v1.json' }
                if (indexes.size() != 1) {
                    throw new GradleException("Packaged yano.jar must contain exactly one plugin index; found ${indexes.size()}")
                }
                apiPrefix = archive.getInputStream(archive.getEntry('META-INF/yano-api-prefix-v1')).text.trim()
            }
            String apiPath = apiPrefix == '/' ? '' : apiPrefix
            def pluginDirectory = java.nio.file.Files.createDirectory(smokeRoot.resolve('plugins'))
            def fixture = fixtureJar.get().asFile.toPath()
            java.nio.file.Files.copy(fixture, pluginDirectory.resolve(fixture.fileName))
            def stateDirectory = smokeRoot.resolve('chainstate')
            def logFile = smokeRoot.resolve('jvm.log')
            def ports = allocateLoopbackPorts(2)
            int httpPort = ports[0]
            def command = [new File(System.getProperty('java.home'), 'bin/java').absolutePath]
            command.addAll(pluginConformanceRuntimeArguments(httpPort, ports[1], root, stateDirectory, pluginDirectory))
            command.addAll(['-jar', jar.absolutePath])
            def processBuilder = new ProcessBuilder(command).directory(root)
                    .redirectErrorStream(true).redirectOutput(logFile.toFile())
            ['YANO_PLUGINS_DENY_LIST', 'YANO_API_PREFIX', 'QUARKUS_RESTEASY_PATH'].each {
                processBuilder.environment().remove(it)
            }
            def logTail = {
                if (!java.nio.file.Files.isRegularFile(logFile)) return '<packaged JVM process produced no log>'
                def lines = java.nio.file.Files.readAllLines(logFile)
                (lines.size() <= 400 ? lines : (lines.take(150) + ['... packaged JVM log omitted ...']
                        + lines.takeRight(250))).join(System.lineSeparator())
            }
            process = processBuilder.start()
            long deadline = System.nanoTime() + java.util.concurrent.TimeUnit.SECONDS.toNanos(90)
            boolean live = false
            while (!live && System.nanoTime() < deadline && process.isAlive()) {
                try {
                    live = httpRequest(httpPort, 'GET', '/q/health/live', null, null, false).status == 200
                } catch (IOException ignored) {
                    // Listener is not ready yet.
                }
                if (!live) Thread.sleep(250)
            }
            if (!live) {
                def state = process.isAlive() ? 'did not become live' : "exited with code ${process.exitValue()}"
                throw new GradleException("Packaged JVM plugin catalog smoke ${state}.${System.lineSeparator()}${logTail()}")
            }

            awaitPluginConformanceStatus(httpPort, apiPath, 90, process, logTail)
            assertPluginConformanceQueryApis(httpPort, apiPath)
            assertPluginOperationsAdapters(httpPort, apiPath, apiPrefix, 90)

            def provenancePrefix = 'YANO_PLUGIN_CATALOG_PROVENANCE '
            def marker = 'ADR-011.2 node-plugin conformance activated through catalog'
            long evidenceDeadline = System.nanoTime() + java.util.concurrent.TimeUnit.SECONDS.toNanos(5)
            String output = ''
            while (System.nanoTime() < evidenceDeadline && process.isAlive()) {
                output = java.nio.file.Files.readString(logFile)
                if (output.contains(provenancePrefix) && output.contains(marker)) break
                Thread.sleep(100)
            }
            def provenanceLines = output.readLines().findAll { it.contains(provenancePrefix) }
            if (provenanceLines.size() != 1) {
                throw new GradleException("Packaged JVM smoke expected one provenance line, found "
                        + "${provenanceLines.size()}.${System.lineSeparator()}${logTail()}")
            }
            if (output.readLines().count { it.contains(marker) } != 1) {
                throw new GradleException('Packaged JVM directory plugin was not selected and activated exactly once.'
                        + "${System.lineSeparator()}${logTail()}")
            }
            logger.lifecycle("Packaged JVM plugin catalog smoke passed for ${jar.absolutePath}")
        } catch (Throwable failure) {
            primaryFailure = failure
            throw failure
        } finally {
            try {
                if (process != null && process.isAlive()) {
                    process.destroy()
                    if (!process.waitFor(10, java.util.concurrent.TimeUnit.SECONDS)) {
                        process.destroyForcibly()
                        if (!process.waitFor(10, java.util.concurrent.TimeUnit.SECONDS)) {
                            throw new GradleException("Packaged JVM smoke process did not terminate: ${process.pid()}")
                        }
                    }
                }
            } catch (Throwable cleanupFailure) {
                if (primaryFailure != null) primaryFailure.addSuppressed(cleanupFailure)
                else throw cleanupFailure
            } finally {
                try {
                    project.delete(smokeRoot.toFile())
                } catch (Throwable cleanupFailure) {
                    if (primaryFailure != null) primaryFailure.addSuppressed(cleanupFailure)
                    else throw cleanupFailure
                }
            }
        }
    }
}
