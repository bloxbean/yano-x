            stateDirectory.fileName.toString() + '-appchain-chainstate')
    [
            '-Dyano.app-chain.api.auth.enabled=false',
            "-Dyano.app-chain.api.keys=${pluginOperationsSmokeApiKey}",
            '-Dquarkus.http.host=127.0.0.1',
            "-Dquarkus.http.port=${httpPort}",
            '-Dquarkus.console.color=false',
            '-Dyano.auto-sync-start=true',
            '-Dyano.client.enabled=false',
            '-Dyano.server.enabled=true',
            "-Dyano.server.port=${nodePort}",
            '-Dyano.storage.rocksdb=false',
            '-Dyano.block-producer.tx-evaluation=false',
            "-Dyano.storage.path=${stateDirectory.toAbsolutePath()}",
            "-Dyano.app-chain.storage.path=${appChainStateDirectory.toAbsolutePath()}",
            "-Dyano.genesis.shelley-genesis-file=${genesisDirectory.resolve('shelley-genesis.json')}",
            "-Dyano.genesis.byron-genesis-file=${genesisDirectory.resolve('byron-genesis.json')}",
            "-Dyano.genesis.alonzo-genesis-file=${genesisDirectory.resolve('alonzo-genesis.json')}",
            "-Dyano.genesis.conway-genesis-file=${genesisDirectory.resolve('conway-genesis.json')}",
            "-Dyano.genesis.protocol-parameters-file=${genesisDirectory.resolve('protocol-param.json')}",
            "-Dyano.plugins.directory=${pluginDirectory.toAbsolutePath()}",
