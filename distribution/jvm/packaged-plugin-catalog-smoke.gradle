            '-Dyano.app-chain.state.commitment-profile=mpf-blake2b256-v1',
            '-Dyano.app-chain.state.format-fingerprint='
                    + '91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b',
            '-Dyano.app-chain.state.genesis-id='
                    + '1111111111111111111111111111111111111111111111111111111111111111',
