            '-Dyano.app-chain.enabled=true',
            '-Dyano.app-chain.chain-id=conformance-chain',
            '-Dyano.app-chain.signing-key=conformance-signer:key',
            "-Dyano.app-chain.members=${pluginConformanceMemberKey}",
