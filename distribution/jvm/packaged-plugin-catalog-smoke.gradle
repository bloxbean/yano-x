import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// ADR-011.2 packaged conformance, moved from Yano's :app:packagedJvmPluginCatalogSmoke (ebd3eeea4)
// with ADR-064: start the integrated yano.jar of the unpacked JVM ZIP, load the conformance fixture
// from an external plugin directory and activate every typed fixture kind on a one-member chain
// through the real catalog-owned app-chain path. The fixture poisons its provider-callback TCCL, so
// successful product callbacks also prove facade mediation rather than raw ServiceLoader reachability.

def distributionZip = tasks.named('yanoXJvmDistZip', Zip).flatMap { it.archiveFile }
def distributionRootName = "yano-x-jvm-${project.version.toString().replaceAll('-SNAPSHOT', '')}"

def pluginConformanceBundleId = 'org.yanoproject.fixture.plugin-conformance'
def pluginConformanceMemberKey = '00' * 32
def pluginOperationsSmokeApiKey = 'plugin-operations-smoke-full-key'

def allocateLoopbackPorts = { int count ->
    def address = InetAddress.getByName('127.0.0.1')
    def sockets = []
    try {
        count.times { sockets.add(new ServerSocket(0, 1, address)) }
        return sockets.collect { it.localPort }
    } finally {
        sockets.reverseEach { it.close() }
    }
}

