import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.util.zip.ZipFile

def requestedYanoVersion = providers.gradleProperty('yanoVersion')
def baseYanoDistribution = project.ext.yanoXBaseJvmDistribution
def runtimeBundleSpecifications = project.ext.yanoXRuntimeBundleSpecifications
def defaultBundleIds = project.ext.yanoXDefaultBundleIds
def optionalBundleIds = project.ext.yanoXOptionalBundleIds
def defaultBundleFiles = project.ext.yanoXDefaultBundleFiles
def optionalBundleFiles = project.ext.yanoXOptionalBundleFiles
def canonicalBundleName = project.ext.yanoXCanonicalBundleName
def pluginPackManifest = project.ext.yanoXPluginPackManifest
def releaseSbom = project.ext.yanoXReleaseSbom
def fileSha256 = project.ext.yanoXFileSha256
def distVersion = project.version.toString().replaceAll('-SNAPSHOT', '')
def distributionRoot = "yano-x-jvm-${distVersion}"
def generatedDistributionManifest = layout.buildDirectory.file(
        'generated/distribution/jvm/yano-x-distribution-v1.json')
def devtoolsInstallDirectory = project(':tooling:devtools').layout.buildDirectory.dir(
        'install/yano-devtools')
def deploymentInstallDirectory = project(':tooling:deployment').layout.buildDirectory.dir(
        'install/yano-x-deploy')
def studioDirectory = project(':tooling:studio').layout.buildDirectory.dir('studio')
def eutxoUiDirectory = project(':products:eutxo:ui').layout.projectDirectory.dir('build/site')
def eutxoUiSbom = project(':products:eutxo:ui').layout.projectDirectory.file(
        'build/eutxo-ui.cdx.json')
def devtoolsMetadata = project(':tooling:devtools').file(
        'src/main/resources/appchain-dx/v1alpha1')
def devtoolsSkill = project(':tooling:devtools').file(
        'src/main/resources/appchain-dx/v1alpha1/skills/configure-yano-appchain')
def eutxoZkAcceptance = rootProject.file('ledgers/eutxo-zk/acceptance')
def evidenceDemoRunnerFile = project(':products:evidence:demo-runner').layout.buildDirectory.file(
        "libs/yano-x-evidence-demo-runner-${project.version}-all.jar")
def evidenceDemoArtifactDirectory = layout.buildDirectory.dir(
        'prepared/evidence-demo-artifacts')

tasks.register('generateYanoXDistributionManifest') {
    dependsOn tasks.named('verifyYanoInputs'),
            tasks.named('generatePluginPackManifest')
    group = 'distribution'
    description = 'Writes the JVM-only Yano X distribution identity.'
    inputs.file(pluginPackManifest)
    inputs.files(baseYanoDistribution).withPropertyName('yanoJvmDist').optional()
    inputs.property('yanoVersion', requestedYanoVersion).optional(true)
    outputs.file(generatedDistributionManifest)

    doLast {
        def pack = new JsonSlurper().parse(pluginPackManifest.get().asFile)
        def output = generatedDistributionManifest.get().asFile
        output.parentFile.mkdirs()
        output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                schemaVersion: 1,
                product: 'yano-x',
                distribution: 'jvm',
                version: project.version.toString(),
                yanoVersion: requestedYanoVersion.get(),
                baseDistributionSha256: fileSha256(baseYanoDistribution.get()),
                pluginPackManifestSha256: fileSha256(pluginPackManifest.get().asFile),
                availablePluginBundleCount: pack.bundles.size(),
                installedPluginBundleCount: defaultBundleIds.size(),
                optionalPluginBundleCount: optionalBundleIds.size(),
                nativeImageSupported: false
        ])) + '\n', 'UTF-8')
    }
}

def rebaseBaseRoot = { details ->
    def segments = details.relativePath.segments.toList()
    if (segments.size() <= 1) {
        details.exclude()
    } else {
        def rebasedSegments = segments.drop(1)
        if (rebasedSegments == ['LICENSE']) {
            rebasedSegments = ['LICENSE.yano']
        }
        details.relativePath = org.gradle.api.file.RelativePath.parse(
                details.relativePath.file,
                "${distributionRoot}/${rebasedSegments.join('/')}")
    }
}

tasks.register('yanoXJvmDistZip', Zip) {
    dependsOn tasks.named('generateYanoXDistributionManifest'),
            tasks.named('normalizeYanoXReleaseSbom'),
            ':tooling:devtools:installDist', ':tooling:deployment:installDist',
            ':tooling:studio:prepareStudio',
            ':products:eutxo:ui:frontendBuild', ':products:eutxo:ui:frontendSbom',
            ':products:evidence:demo-runner:shadowJar'
    group = 'distribution'
    description = 'Creates the batteries-included Yano X JVM distribution.'
    archiveFileName = "yano-x-jvm-${distVersion}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    reproducibleFileOrder = true
    preserveFileTimestamps = false

    from({ zipTree(baseYanoDistribution.get()) }) {
        eachFile rebaseBaseRoot
        includeEmptyDirs = false
        filesMatching(['**/*.sh', '**/bin/*']) {
            permissions { unix('755') }
        }
    }
    into(distributionRoot) {
        from(rootProject.file('LICENSE'))
        from(releaseSbom) {
            into 'sbom'
        }
        from(defaultBundleFiles) {
            into 'plugins'
            rename { name -> canonicalBundleName(name) }
        }
        from(optionalBundleFiles) {
            into 'optional-plugins'
            rename { name -> canonicalBundleName(name) }
        }
        from(pluginPackManifest)
        from(generatedDistributionManifest)
        from(devtoolsInstallDirectory) {
            into 'tools/yano-appchain'
            filesMatching(['bin/*']) {
                permissions { unix('755') }
            }
        }
        from(deploymentInstallDirectory) {
            into 'tools/yano-deploy'
            filesMatching(['bin/*']) {
                permissions { unix('755') }
            }
        }
        from(studioDirectory) {
            into 'studio'
        }
        from(eutxoUiDirectory) {
            into 'product-ui/eutxo'
        }
        from(eutxoUiSbom) {
            into 'sbom'
        }
        from(devtoolsSkill) {
            into 'skills/configure-yano-appchain'
        }
        from(devtoolsMetadata) {
            into 'config/schema'
            include '*.schema.json', 'appchain-release-acceptance-index.json'
        }
        from(eutxoZkAcceptance) {
            into 'config/schema'
            include '*.schema.json'
        }
        from(eutxoZkAcceptance) {
            into 'evidence/eutxo-zk'
            include '*-v1.json'
            exclude '*.schema.json'
        }
        from(rootProject.file('scripts/appchain-cluster')) {
            into 'appchain-cluster'
            exclude '.cluster-data/**', '**/*.log'
            filesMatching(['**/*.sh', '**/*.py']) {
                permissions { unix('755') }
            }
        }
        from(rootProject.file('products/evidence/harness')) {
            into 'examples/evidence'
            exclude '.demo-data/**', '.demo-runtime/**', '.demo-secrets/**',
                    '**/__pycache__/**', '**/*.pyc', '**/*.log'
            filesMatching(['**/*.sh', '**/*.py']) {
                permissions { unix('755') }
            }
        }
        from(evidenceDemoRunnerFile) {
            into 'examples/evidence'
            rename { 'runner.jar' }
        }
        from(rootProject.file('docs')) {
            into 'docs'
            exclude '**/*.pptx', '**/*.pdf'
        }
        from(rootProject.file('docker/jvm/entrypoint.sh')) {
            into 'docker/jvm'
            filePermissions { unix('755') }
        }
    }
}

tasks.register('prepareEvidenceDemoArtifacts', Sync) {
    dependsOn tasks.named('verifyYanoInputs'), ':products:evidence:demo-runner:shadowJar',
            ':connectors:kafka:shadowJar', ':connectors:ipfs:shadowJar',
            ':connectors:objectstore-s3:shadowJar', ':state-machines:stdlib:shadowJar',
            ':composition:runtime:shadowJar', ':capabilities:role-workflow:shadowJar',
            ':products:evidence:registry:shadowJar',
            ':products:evidence:profile:shadowJar'
    group = 'distribution'
    description = 'Stages release-matched artifacts for the source evidence harness.'
    into evidenceDemoArtifactDirectory

    from(evidenceDemoRunnerFile) {
        rename { 'runner.jar' }
    }
    from(project(':connectors:kafka').layout.buildDirectory.dir('libs')) {
        include "yano-x-kafka-${project.version}-bundle.jar"
        into 'plugins'
    }
    from(project(':connectors:ipfs').layout.buildDirectory.dir('libs')) {
        include "yano-x-ipfs-${project.version}-bundle.jar"
        into 'plugins'
    }
    from(project(':connectors:objectstore-s3').layout.buildDirectory.dir('libs')) {
        include "yano-x-objectstore-s3-${project.version}-bundle.jar"
        into 'plugins'
    }
    from(project(':state-machines:stdlib').layout.buildDirectory.dir('libs')) {
        include "yano-x-stdlib-${project.version}-bundle.jar"
        into 'plugins'
    }
    from(project(':composition:runtime').layout.buildDirectory.dir('libs')) {
        include "yano-x-composite-${project.version}-bundle.jar"
        into 'plugins'
    }
    from(project(':capabilities:role-workflow').layout.buildDirectory.dir('libs')) {
        include "yano-x-role-workflow-${project.version}-bundle.jar"
        into 'plugins'
    }
    from(project(':products:evidence:registry').layout.buildDirectory.dir('libs')) {
        include "yano-x-evidence-registry-${project.version}-bundle.jar"
        into 'plugins'
    }
    from(project(':products:evidence:profile').layout.buildDirectory.dir('libs')) {
        include "yano-x-evidence-profile-${project.version}-bundle.jar"
        into 'plugins'
    }
    from({ zipTree(baseYanoDistribution.get()) }) {
        include '**/yano.jar', '**/config/**'
        eachFile { details ->
            def segments = details.relativePath.segments.toList()
            if (segments.size() <= 1) {
                details.exclude()
            } else {
                details.relativePath = org.gradle.api.file.RelativePath.parse(
                        details.relativePath.file,
                        "yano-context/yano/${segments.drop(1).join('/')}")
            }
        }
        includeEmptyDirs = false
    }
    from(rootProject.file('docker/jvm/entrypoint.sh')) {
        into 'yano-context'
        filePermissions { unix('755') }
    }
}

tasks.register('verifyYanoXJvmDistribution') {
    dependsOn tasks.named('yanoXPluginPackZip'),
            tasks.named('yanoXJvmDistZip')
    group = 'verification'
    description = 'Verifies the Yano X plugin pack and JVM-only distribution.'
    inputs.file(tasks.named('yanoXPluginPackZip', Zip).flatMap { it.archiveFile })
    inputs.file(tasks.named('yanoXJvmDistZip', Zip).flatMap { it.archiveFile })

    doLast {
        def pack = new JsonSlurper().parse(pluginPackManifest.get().asFile)
        def expectedSbom = new JsonSlurper().parse(releaseSbom.get().asFile)
        def expectedPluginFiles = pack.bundles.collect { bundle ->
            bundle.file
        }.toSet()
        def expectedDefaultPluginFiles = pack.bundles.findAll { bundle ->
            bundle.installMode == 'default'
        }.collect { bundle -> bundle.file }.toSet()
        def expectedOptionalPluginFiles = pack.bundles.findAll { bundle ->
            bundle.installMode == 'optional'
        }.collect { bundle -> bundle.file }.toSet()
        if (expectedDefaultPluginFiles.size() != defaultBundleIds.size()
                || expectedOptionalPluginFiles.size() != optionalBundleIds.size()
                || expectedDefaultPluginFiles + expectedOptionalPluginFiles
                != expectedPluginFiles) {
            throw new GradleException(
                    "Yano X plugin-pack selection mismatch: ${pack.bundles}")
        }
        def pluginPack = tasks.named('yanoXPluginPackZip', Zip).get()
                .archiveFile.get().asFile
        def packRoot = "yano-x-plugin-pack-${distVersion}"
        new ZipFile(pluginPack).withCloseable { archive ->
            def roots = archive.entries().collect { entry ->
                entry.name.tokenize('/').find()
            }.findAll { value -> value != null }.toSet()
            if (roots != [packRoot] as Set) {
                throw new GradleException(
                        "Yano X plugin pack has unexpected roots: ${roots.sort()}")
            }
            def actualDefaultPluginFiles = archive.entries().findAll { entry ->
                entry.name.startsWith("${packRoot}/plugins/")
                        && entry.name.endsWith('.jar')
            }.collect { entry -> entry.name.tokenize('/').last() }
            def actualOptionalPluginFiles = archive.entries().findAll { entry ->
                entry.name.startsWith("${packRoot}/optional-plugins/")
                        && entry.name.endsWith('.jar')
            }.collect { entry -> entry.name.tokenize('/').last() }
            if (actualDefaultPluginFiles.size() != expectedDefaultPluginFiles.size()
                    || actualDefaultPluginFiles.toSet() != expectedDefaultPluginFiles
                    || actualOptionalPluginFiles.size() != expectedOptionalPluginFiles.size()
                    || actualOptionalPluginFiles.toSet() != expectedOptionalPluginFiles) {
                throw new GradleException(
                        'Yano X plugin-pack default/optional set mismatch: '
                                + "default=${actualDefaultPluginFiles.sort()}, "
                                + "optional=${actualOptionalPluginFiles.sort()}")
            }
            def manifestEntry = archive.getEntry(
                    "${packRoot}/yano-x-plugin-pack-v1.json")
            if (archive.getEntry("${packRoot}/LICENSE") == null) {
                throw new GradleException('Yano X plugin pack is missing LICENSE')
            }
            def sbomEntry = archive.getEntry("${packRoot}/sbom/yano-x.cdx.json")
            def packagedSbom = sbomEntry == null ? null
                    : archive.getInputStream(sbomEntry).withCloseable { stream ->
                        new JsonSlurper().parse(stream)
                    }
            if (packagedSbom != expectedSbom) {
                throw new GradleException(
                        'Yano X plugin-pack SBOM is missing or differs from its input')
            }
            def packagedManifest = manifestEntry == null ? null
                    : archive.getInputStream(manifestEntry).withCloseable { stream ->
                        new JsonSlurper().parse(stream)
                    }
            if (packagedManifest != pack) {
                throw new GradleException(
                        'Yano X plugin-pack manifest is missing or differs from its input')
            }
        }
        def distribution = tasks.named('yanoXJvmDistZip', Zip).get()
                .archiveFile.get().asFile
        def root = distributionRoot
        new ZipFile(distribution).withCloseable { archive ->
            def roots = archive.entries().collect { entry ->
                entry.name.tokenize('/').find()
            }.findAll { value -> value != null }.toSet()
            if (roots != [root] as Set) {
                throw new GradleException(
                        "Yano X distribution has unexpected roots: ${roots.sort()}")
            }
            def actualDefaultPluginFiles = archive.entries().findAll { entry ->
                entry.name.startsWith("${root}/plugins/") && entry.name.endsWith('.jar')
            }.collect { entry -> entry.name.tokenize('/').last() }
            def actualOptionalPluginFiles = archive.entries().findAll { entry ->
                entry.name.startsWith("${root}/optional-plugins/")
                        && entry.name.endsWith('.jar')
            }.collect { entry -> entry.name.tokenize('/').last() }
            if (actualDefaultPluginFiles.size() != expectedDefaultPluginFiles.size()
                    || actualDefaultPluginFiles.toSet() != expectedDefaultPluginFiles
                    || actualOptionalPluginFiles.size() != expectedOptionalPluginFiles.size()
                    || actualOptionalPluginFiles.toSet() != expectedOptionalPluginFiles) {
                throw new GradleException(
                        'Yano X distribution default/optional set mismatch: '
                                + "default=${actualDefaultPluginFiles.sort()}, "
                                + "optional=${actualOptionalPluginFiles.sort()}")
            }
            def manifestEntry = archive.getEntry(
                    "${root}/yano-x-distribution-v1.json")
            if (archive.getEntry("${root}/LICENSE") == null) {
                throw new GradleException('Yano X JVM distribution is missing LICENSE')
            }
            if (archive.getEntry("${root}/LICENSE.yano") == null) {
                throw new GradleException('Yano X JVM distribution is missing the Yano LICENSE')
            }
            def sbomEntry = archive.getEntry("${root}/sbom/yano-x.cdx.json")
            def packagedSbom = sbomEntry == null ? null
                    : archive.getInputStream(sbomEntry).withCloseable { stream ->
                        new JsonSlurper().parse(stream)
                    }
            if (packagedSbom != expectedSbom) {
                throw new GradleException(
                        'Yano X JVM distribution SBOM is missing or differs from its input')
            }
            if (manifestEntry == null) {
                throw new GradleException('Yano X distribution manifest is missing')
            }
            def manifest = archive.getInputStream(manifestEntry).withCloseable { stream ->
                new JsonSlurper().parse(stream)
            }
            def expectedManifest = [
                    schemaVersion: 1,
                    product: 'yano-x',
                    distribution: 'jvm',
                    version: project.version.toString(),
                    yanoVersion: requestedYanoVersion.get(),
                    baseDistributionSha256: fileSha256(baseYanoDistribution.get()),
                    pluginPackManifestSha256: fileSha256(pluginPackManifest.get().asFile),
                    availablePluginBundleCount: runtimeBundleSpecifications.size(),
                    installedPluginBundleCount: defaultBundleIds.size(),
                    optionalPluginBundleCount: optionalBundleIds.size(),
                    nativeImageSupported: false
            ]
            if (manifest != expectedManifest) {
                throw new GradleException(
                        "Unexpected Yano X distribution contract: ${manifest}")
            }
            def packManifestEntry = archive.getEntry(
                    "${root}/yano-x-plugin-pack-v1.json")
            def embeddedPack = packManifestEntry == null ? null
                    : archive.getInputStream(packManifestEntry).withCloseable { stream ->
                        new JsonSlurper().parse(stream)
                    }
            if (embeddedPack != pack) {
                throw new GradleException(
                        'Yano X distribution plugin-pack manifest is missing or mismatched')
            }
            [
                    'tools/yano-appchain/bin/yano-appchain',
                    'tools/yano-deploy/bin/yano-x-deploy',
                    'sbom/yano.cdx.json',
                    'studio/index.html',
                    'product-ui/eutxo/index.html',
                    'product-ui/eutxo/eutxo-ui-config.json',
                    'sbom/eutxo-ui.cdx.json',
                    'skills/configure-yano-appchain/SKILL.md',
                    'config/schema/appchain-metadata-trust.schema.json',
                    'config/schema/eutxo-zk-network-acceptance.schema.json',
                    'evidence/eutxo-zk/network-acceptance-v1.json',
                    'appchain-cluster/cluster.sh',
                    'examples/evidence/demo.sh',
                    'examples/evidence/runner.jar',
                    'docs/appchain/README.md',
                    'docker/jvm/entrypoint.sh'
            ].each { relativePath ->
                if (archive.getEntry("${root}/${relativePath}") == null) {
                    throw new GradleException(
                            "Yano X distribution is missing ${relativePath}")
                }
            }
            def nativeEntries = archive.entries().findAll { entry ->
                entry.name.endsWith('/yano') || entry.name.endsWith('.exe')
            }
            if (archive.getEntry("${root}/yano.jar") == null
                    || !nativeEntries.isEmpty()) {
                throw new GradleException(
                        'Yano X JVM distribution is missing yano.jar or contains a native binary')
            }
        }
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('yanoXPluginPackZip'),
            tasks.named('yanoXJvmDistZip')
}
