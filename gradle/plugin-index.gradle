import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult

// ADR-064 D8: the single plugin-index script of Yano X. The index of a host class path composed from
// Yano's published artifacts and Yano X is generated by Yano's published PluginIndexGenerator over the
// whole host class path; each bundle's closure is the resolution-graph closure of its root.
//
//   pluginIndexTask(name, hostClasspath, generatorClasspath, bundles, outputFile)
//       registers the generator over any resolvable host class path (qa/framework/host-matrix);
//   registerPluginIndex(bundles)
//       embeds the index in a Quarkus application's resources (distribution/jvm).
//
// bundles maps '<bundle-id>' to [root: ':project:path' or 'group:module', manifestVersion: '<version>'].
// The generated index must hold exactly these bundles, each at its expected manifest version.

ext.pluginIndexTask = { String name, Configuration hostClasspath, FileCollection generatorClasspath,
                        Map<String, Map<String, String>> bundles, Provider<RegularFile> outputFile ->
    def bundleRoots = bundles.collectEntries { bundleId, bundle -> [(bundleId): bundle.root] }
    def manifestVersions = bundles.collectEntries { bundleId, bundle -> [(bundleId): bundle.manifestVersion] }
    tasks.register(name, JavaExec) {
        inputs.files(hostClasspath)
        inputs.property('bundles', bundles)
        outputs.file(outputFile)
        classpath = generatorClasspath
        mainClass = 'org.yanoproject.catalog.PluginIndexGenerator'
        doFirst {
            def artifactResults = hostClasspath.incoming.artifactView { }.artifacts.artifacts
            def artifactsByComponent = artifactResults.groupBy { it.id.componentIdentifier }
            def components = hostClasspath.incoming.resolutionResult.allComponents
            def arguments = ['--output', outputFile.get().asFile.path, '--strict-bundle-closures']
            bundleRoots.toSorted().each { bundleId, root ->
                def start = components.find { candidate ->
                    root.startsWith(':')
                            ? candidate.id instanceof ProjectComponentIdentifier && candidate.id.projectPath == root
                            : candidate.id instanceof ModuleComponentIdentifier
                                    && "${candidate.id.group}:${candidate.id.module}" == root
                }
                if (start == null) throw new GradleException("Plugin bundle root ${root} is absent from ${hostClasspath.name}")
                def pending = new ArrayDeque([start])
                def visited = [] as Set
                while (!pending.isEmpty()) {
                    def component = pending.removeFirst()
                    if (visited.add(component.id)) {
                        component.dependencies.findAll { it instanceof ResolvedDependencyResult }
                                .each { pending.addLast(it.selected) }
                    }
                }
                visited.collectMany { artifactsByComponent[it] ?: [] }.collect { it.file }.unique().sort().each {
                    arguments.addAll(['--bundle-closure', bundleId, it.absolutePath])
                }
            }
            arguments.add('--')
            arguments.addAll(artifactResults.collect { it.file.absolutePath }.sort())
            // Absolute closure paths exceed command-line limits; the generator reads an argument file.
            def argumentsFile = new File(temporaryDir, 'plugin-index-args.txt')
            argumentsFile.setText(arguments.join('\n') + '\n', 'UTF-8')
            args = ['--args-file', argumentsFile.absolutePath]
        }
        doLast {
            def index = new groovy.json.JsonSlurper().parse(outputFile.get().asFile)
            def indexed = index.bundles.collectEntries { [(it.manifest.id): it.manifest.version?.toString()] }
            if (indexed != manifestVersions) {
                throw new GradleException("Plugin index bundles ${indexed} do not match the declared ${manifestVersions}")
            }
        }
    }
}

ext.registerPluginIndex = { Map<String, Map<String, String>> bundles ->
    def generator = configurations.create('pluginIndexGenerator') {
        canBeConsumed = false
    }
    dependencies.add(generator.name, rootProject.ext.yanoModule('yano-plugin-catalog'))
    def outputDir = layout.buildDirectory.dir('generated/plugin-index')
    sourceSets.main.resources.srcDir(outputDir)
    def task = pluginIndexTask('generatePluginIndex', configurations.runtimeClasspath, generator, bundles,
            outputDir.map { it.file('META-INF/yano-plugin-index-v1.json') })
    tasks.named('processResources') { dependsOn task }
    task
}
