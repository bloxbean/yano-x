import org.gradle.api.publish.maven.MavenPublication

// Publication identity for every Yano X artifact: shared POM metadata, the
// staging/release repositories, and the dependency-complete runtime plugin
// bundle publications. Applied to the root project by build.gradle.

def artifactInventory = rootProject.ext.yanoXArtifactInventory
def internalRepository = providers.gradleProperty('internalRepository')

def projectUrl = 'https://github.com/bloxbean/yano-x'

// One POM identity for thin modules, runtime bundles, and the BOM. Maven
// Central rejects any published component missing developer info, so every
// publication supplies it.
ext.yanoXPom = { pom, String pomName, String pomDescription,
                boolean withDevelopers = true ->
    pom.name = pomName
    pom.description = pomDescription
    pom.url = projectUrl
    pom.licenses {
        license {
            name = 'The MIT License'
            url = 'https://opensource.org/licenses/mit-license.php'
        }
    }
    if (withDevelopers) {
        pom.developers {
            developer {
                id = 'satran004'
                name = 'Satya'
            }
        }
    }
    pom.scm {
        connection = 'scm:git:git://github.com/bloxbean/yano-x.git'
        developerConnection = 'scm:git:ssh://git@github.com/bloxbean/yano-x.git'
        url = projectUrl
    }
}

// The internal repository is used to rehearse and verify a release without
// writing to an external service.
allprojects { candidate ->
    candidate.pluginManager.withPlugin('maven-publish') {
        candidate.publishing.repositories {
            if (internalRepository.isPresent()) {
                maven {
                    name = 'internal'
                    url = candidate.uri(internalRepository.get())
                }
            }
        }
    }
}

// The Maven release scope: every inventoried artifact whose publication type is
// reusable, plus the BOM. This drives both the Central deployment contents and
// verifyMavenReleasePublicationScope, so the two can never disagree.
def releaseSpecifications = artifactInventory.artifacts.findAll {
    rootProject.ext.yanoXMavenReleasePublicationTypes.contains(
            it.publicationType.toString())
            // Modules folded into an aggregate coordinate still build and still
            // reach the internal repository; only the aggregate goes to Central.
            && it.aggregatedInto == null
            // Demos, examples and product-specific runtimes ship in the GitHub
            // release and the plugin pack, not as downstream dependencies.
            && it.publishToCentral != false
}
def releaseProjects = releaseSpecifications.collect {
    project(it.modulePath.toString())
} + project(':bom')

// Central Portal publishing via the native publisher API. `USER_MANAGED` uploads
// the deployment and stops at VALIDATED: nothing reaches Maven Central until a
// human publishes it, either from the portal UI or through the approval-gated
// .github/workflows/publish-central.yml. Do not set `publishingTimeout` here --
// nmcp rejects it under USER_MANAGED.
nmcpAggregation {
    // Product modules deliberately reuse leaf names (products/*/ui, */cli,
    // */runtime and six more), so the aggregation is keyed on full project
    // paths instead. verifyMavenReleasePublicationScope asserts the resolved
    // deployment still matches the artifact inventory exactly.
    allowDuplicateProjectNames = true
    centralPortal {
        username = System.getenv('MAVEN_USERNAME')
        password = System.getenv('MAVEN_PASSWORD')
        publishingType = 'USER_MANAGED'
        // Names the pending deployment in the portal list. The deployment id
        // itself is assigned by the server and reported by the upload task.
        publicationName = "yano-x:${project.version}"
        // The aggregate zip carries every module plus the shadow bundles; the
        // 10 minute default validation wait is tight for it.
        validationTimeout = java.time.Duration.ofMinutes(30)
    }
}

// Only these projects reach Maven Central. Applying `com.gradleup.nmcp` more
// broadly (gradle/yano-x-module.gradle) is harmless because the deployment
// contents are decided here.
dependencies {
    releaseProjects.each { candidate ->
        nmcpAggregation(project(candidate.path))
    }
}

// The scope check must gate the work itself, not the lifecycle alias.
// `publishAggregationToCentralPortal` is an alias whose dependencies are
// unordered relative to each other, so hanging the check off it lets the upload
// run first. Attaching it to the zip -- which every portal task depends on --
// puts the check ahead of both the bundle and the network calls, and covers the
// `nmcp`-prefixed task names when invoked directly.
tasks.matching {
    it.name in ['nmcpZipAggregation',
                'nmcpPublishAggregationToCentralPortal',
                'nmcpPublishAggregationToCentralPortalSnapshots']
}.configureEach {
    dependsOn 'verifyMavenReleasePublicationScope'
}

// Runtime plugin bundles are shadow jars published under their own coordinate,
// and must never leak into the thin `mavenJava` publication.
gradle.projectsEvaluated {
    artifactInventory.artifacts.findAll {
        it.publicationType == 'runtime-plugin'
    }.each { specification ->
        def pluginProject = project(specification.modulePath.toString())
        def shadowJar = pluginProject.tasks.named('shadowJar')
        pluginProject.components.java.withVariantsFromConfiguration(
                pluginProject.configurations.shadowRuntimeElements) {
            skip()
        }
        def mainPublication = pluginProject.publishing.publications
                .findByName('mavenJava') as MavenPublication
        if (mainPublication == null) {
            throw new GradleException(
                    "Runtime plugin ${pluginProject.path} has no thin publication")
        }
        mainPublication.artifacts.findAll { artifact ->
            artifact.classifier == 'bundle'
        }.each { artifact -> mainPublication.artifacts.remove(artifact) }

        // Dedicated Jar tasks, not the mavenJava publication's sourceJar/
        // javadocJar: two publications signing the same underlying jar file
        // would make both Sign tasks claim the same output .asc path, which
        // Gradle rejects as an undeclared, order-dependent producer clash.
        def bundleSourceJar = pluginProject.tasks.register(
                'pluginBundleSourceJar', Jar) {
            archiveBaseName = specification.bundleArtifactId.toString()
            archiveClassifier = 'sources'
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            from pluginProject.sourceSets.main.allJava
        }
        def bundleJavadocJar = pluginProject.tasks.register(
                'pluginBundleJavadocJar', Jar) {
            dependsOn pluginProject.tasks.named('javadoc')
            archiveBaseName = specification.bundleArtifactId.toString()
            archiveClassifier = 'javadoc'
            from pluginProject.tasks.named('javadoc').map { it.destinationDir }
        }

        def bundlePublication = pluginProject.publishing.publications
                .create('pluginBundle', MavenPublication) {
            groupId = rootProject.group.toString()
            artifactId = specification.bundleArtifactId.toString()
            artifact(shadowJar) {
                classifier = null
            }
            artifact(bundleSourceJar) {
                classifier = 'sources'
            }
            artifact(bundleJavadocJar) {
                classifier = 'javadoc'
            }
            rootProject.ext.yanoXPom(
                    pom,
                    "${specification.artifactId} deployable plugin bundle",
                    "Dependency-complete Yano X bundle for ${specification.pluginBundleId}")
        }
        // The bundle is a dependency-complete shadow jar delivered through the
        // plugin pack in the GitHub release, not through Maven. Publishing it to
        // Central as well duplicated 307 MB across 18 coordinates for artifacts
        // no downstream build resolves. The publication itself stays so the
        // internal repository and gradle/verification.gradle keep working; only
        // the Central deployment drops it.
        pluginProject.tasks.matching {
            it.name == 'publishPluginBundlePublicationToNmcpRepository'
        }.configureEach { enabled = false }

        if (!pluginProject.version.toString().endsWith('SNAPSHOT')
                && !pluginProject.hasProperty('skipSigning')) {
            pluginProject.signing.sign(bundlePublication)
        }
    }

    tasks.register('verifyMavenReleasePublicationScope') {
        group = 'verification'
        description = 'Verifies the Maven release contains reusable coordinates only.'
        def expected = releaseProjects.collect { it.path } as Set
        def aggregated = configurations.nmcpAggregation.dependencies
                .findAll { it instanceof ProjectDependency }
                .collect { it.path } as Set
        doLast {
            releaseProjects.each { candidate ->
                if (!candidate.pluginManager.hasPlugin('maven-publish')
                        || candidate.publishing.publications.isEmpty()) {
                    throw new GradleException(
                            "Release project ${candidate.path} has no Maven publication")
                }
                // nmcp aggregation is lenient: a project without the plugin is
                // skipped silently rather than failing, which would ship a BOM
                // referencing coordinates that were never uploaded.
                if (!candidate.pluginManager.hasPlugin('com.gradleup.nmcp')) {
                    throw new GradleException(
                            "Release project ${candidate.path} does not apply com.gradleup.nmcp "
                                    + 'and would be dropped from the Central deployment')
                }
            }
            // Bundles must never reappear in the deployment: they are 20x the
            // size of the thin jars and are delivered through the plugin pack.
            releaseProjects.each { candidate ->
                def bundleTask = candidate.tasks.findByName(
                        'publishPluginBundlePublicationToNmcpRepository')
                if (bundleTask != null && bundleTask.enabled) {
                    throw new GradleException(
                            "Runtime bundle for ${candidate.path} would be published to Maven "
                                    + 'Central; bundles ship in the plugin pack instead')
                }
            }
            // The deployment must contain the release scope and nothing else;
            // an extra project here would publish a non-reusable coordinate.
            if (aggregated != expected) {
                throw new GradleException(
                        'Central deployment scope drifted from the artifact inventory. '
                                + "Unexpected: ${aggregated - expected}; missing: ${expected - aggregated}")
            }
        }
    }

    tasks.register('publishMavenReleaseToInternalRepository') {
        group = 'publishing'
        description = 'Publishes reusable Yano X modules and the BOM to an isolated repository.'
        dependsOn tasks.named('verifyMavenReleasePublicationScope')
        dependsOn releaseProjects.collect { candidate ->
            "${candidate.path}:publishAllPublicationsToInternalRepository"
        }
    }
}
