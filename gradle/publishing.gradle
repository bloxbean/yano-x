import org.gradle.api.publish.maven.MavenPublication

// Publication identity for every Yano X artifact: shared POM metadata, the
// staging/release repositories, and the dependency-complete runtime plugin
// bundle publications. Applied to the root project by build.gradle.

def artifactInventory = rootProject.ext.yanoXArtifactInventory
def internalRepository = providers.gradleProperty('internalRepository')

def projectUrl = 'https://github.com/bloxbean/yano-x'

// One POM identity for thin modules, runtime bundles, and the BOM. Maven
// Central rejects any published component missing developer info, so every
// publication supplies it.
ext.yanoXPom = { pom, String pomName, String pomDescription,
                boolean withDevelopers = true ->
    pom.name = pomName
    pom.description = pomDescription
    pom.url = projectUrl
    pom.licenses {
        license {
            name = 'The MIT License'
            url = 'https://opensource.org/licenses/mit-license.php'
        }
    }
    if (withDevelopers) {
        pom.developers {
            developer {
                id = 'satran004'
                name = 'Satya'
            }
        }
    }
    pom.scm {
        connection = 'scm:git:git://github.com/bloxbean/yano-x.git'
        developerConnection = 'scm:git:ssh://git@github.com/bloxbean/yano-x.git'
        url = projectUrl
    }
}

// The internal repository is used to rehearse and verify a release without
// writing to an external service.
allprojects { candidate ->
    candidate.pluginManager.withPlugin('maven-publish') {
        candidate.publishing.repositories {
            if (internalRepository.isPresent()) {
                maven {
                    name = 'internal'
                    url = candidate.uri(internalRepository.get())
                }
            }
        }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl = uri('https://ossrh-staging-api.central.sonatype.com/service/local/')
            snapshotRepositoryUrl = uri(
                    'https://central.sonatype.com/repository/maven-snapshots/')
            username = System.getenv('MAVEN_USERNAME')
            password = System.getenv('MAVEN_PASSWORD')
        }
    }
}

// Runtime plugin bundles are shadow jars published under their own coordinate,
// and must never leak into the thin `mavenJava` publication.
gradle.projectsEvaluated {
    artifactInventory.artifacts.findAll {
        it.publicationType == 'runtime-plugin'
    }.each { specification ->
        def pluginProject = project(specification.modulePath.toString())
        def shadowJar = pluginProject.tasks.named('shadowJar')
        pluginProject.components.java.withVariantsFromConfiguration(
                pluginProject.configurations.shadowRuntimeElements) {
            skip()
        }
        def mainPublication = pluginProject.publishing.publications
                .findByName('mavenJava') as MavenPublication
        if (mainPublication == null) {
            throw new GradleException(
                    "Runtime plugin ${pluginProject.path} has no thin publication")
        }
        mainPublication.artifacts.findAll { artifact ->
            artifact.classifier == 'bundle'
        }.each { artifact -> mainPublication.artifacts.remove(artifact) }

        // Dedicated Jar tasks, not the mavenJava publication's sourceJar/
        // javadocJar: two publications signing the same underlying jar file
        // would make both Sign tasks claim the same output .asc path, which
        // Gradle rejects as an undeclared, order-dependent producer clash.
        def bundleSourceJar = pluginProject.tasks.register(
                'pluginBundleSourceJar', Jar) {
            archiveBaseName = specification.bundleArtifactId.toString()
            archiveClassifier = 'sources'
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            from pluginProject.sourceSets.main.allJava
        }
        def bundleJavadocJar = pluginProject.tasks.register(
                'pluginBundleJavadocJar', Jar) {
            dependsOn pluginProject.tasks.named('javadoc')
            archiveBaseName = specification.bundleArtifactId.toString()
            archiveClassifier = 'javadoc'
            from pluginProject.tasks.named('javadoc').map { it.destinationDir }
        }

        def bundlePublication = pluginProject.publishing.publications
                .create('pluginBundle', MavenPublication) {
            groupId = rootProject.group.toString()
            artifactId = specification.bundleArtifactId.toString()
            artifact(shadowJar) {
                classifier = null
            }
            artifact(bundleSourceJar) {
                classifier = 'sources'
            }
            artifact(bundleJavadocJar) {
                classifier = 'javadoc'
            }
            rootProject.ext.yanoXPom(
                    pom,
                    "${specification.artifactId} deployable plugin bundle",
                    "Dependency-complete Yano X bundle for ${specification.pluginBundleId}")
        }
        if (!pluginProject.version.toString().endsWith('SNAPSHOT')
                && !pluginProject.hasProperty('skipSigning')) {
            pluginProject.signing.sign(bundlePublication)
        }
    }

    def releaseSpecifications = artifactInventory.artifacts.findAll {
        rootProject.ext.yanoXMavenReleasePublicationTypes.contains(
                it.publicationType.toString())
    }
    def releaseProjects = releaseSpecifications.collect {
        project(it.modulePath.toString())
    } + project(':bom')

    tasks.register('verifyMavenReleasePublicationScope') {
        group = 'verification'
        description = 'Verifies the Maven release contains reusable coordinates only.'
        doLast {
            releaseProjects.each { candidate ->
                if (!candidate.pluginManager.hasPlugin('maven-publish')
                        || candidate.publishing.publications.isEmpty()) {
                    throw new GradleException(
                            "Release project ${candidate.path} has no Maven publication")
                }
            }
        }
    }

    tasks.register('publishMavenReleaseToInternalRepository') {
        group = 'publishing'
        description = 'Publishes reusable Yano X modules and the BOM to an isolated repository.'
        dependsOn tasks.named('verifyMavenReleasePublicationScope')
        dependsOn releaseProjects.collect { candidate ->
            "${candidate.path}:publishAllPublicationsToInternalRepository"
        }
    }

    tasks.register('publishMavenReleaseToSonatypeRepository') {
        group = 'publishing'
        description = 'Publishes reusable Yano X modules and the BOM to Maven Central staging.'
        dependsOn tasks.named('verifyMavenReleasePublicationScope')
        dependsOn releaseProjects.collect { candidate ->
            "${candidate.path}:publishAllPublicationsToSonatypeRepository"
        }
    }
}
