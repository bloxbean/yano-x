name: Publish snapshot distributions

# Builds the four archives the GitHub release attaches (JVM distribution, plugin pack, deployment tool, Studio) for a
# snapshot commit and, once a release owner approves, publishes exactly those files to the BloxBean repository
# bucket, read anonymously at https://repo.bloxbean.org/dist/snapshots/yano-x/. Independent of release.yml (GitHub
# releases) and of the Maven snapshot repository. See bloxbean/release-ops docs/12-bloxbean-maven-repository.md,
# Snapshot distributions.
#
# Each commit gets <version>/ with its zips, SHA256SUMS and manifest.json; latest.json names the most recently
# published one. A version directory is never overwritten: manifest.json, uploaded last, marks it as published.
# Every project writes only dist/snapshots/<project>/; one bucket lifecycle rule on dist/snapshots/ expires them.

on:
  workflow_dispatch:

permissions: {}

jobs:
  # Fails before the distribution build: only a -SNAPSHOT commit whose push CI passed, the same rule as the Maven
  # snapshots (bloxbean-snapshot.yml), is published.
  check:
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOWS: build.yml
        run: bash .github/scripts/require-green-ci.sh
      - name: Require a SNAPSHOT version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' gradle.properties \
            | head -1 | tr -d '[:space:]')
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Snapshot distributions require a -SNAPSHOT version. Got: $VERSION" >&2
            exit 1
          fi

  # The archives release.yml attaches ("Stage release assets"), built for this commit. distributionCheck is the
  # packaging and showcase verification the release's `clean build` runs; the tests already passed in push CI. The
  # version gains the short commit id on the command line only (0.1.0-pre4-SNAPSHOT becomes
  # 0.1.0-pre4-1a2b3c4-SNAPSHOT), so every commit's files have their own names and a published build is never
  # overwritten. The Maven snapshots keep the plain version (bloxbean-snapshot.yml).
  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build the distributions
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q properties -PskipSigning=true | awk '/^version:/ { print $2; exit }')
          VERSION="${VERSION%-SNAPSHOT}-${GITHUB_SHA:0:7}-SNAPSHOT"
          ./gradlew distributionCheck :tooling:deployment:distZip :tooling:studio:studioZip \
            -Pversion="$VERSION" -PskipSigning=true --stacktrace
          mkdir dist
          cp distribution/jvm/build/distributions/yano-x-jvm-*.zip \
            distribution/jvm/build/distributions/yano-x-plugin-pack-*.zip \
            tooling/deployment/build/distributions/yano-x-deploy-*.zip \
            tooling/studio/build/distributions/yano-x-studio-*.zip dist/
          for archive in dist/*.zip; do
            unzip -tq "$archive"
          done
      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: yano-x-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # The approval gate, after the build so the reviewer approves zips that were built and smoke-tested. The
  # `release` environment holds no secrets; its reviewers are the release-owners team, and the person who started
  # the run can't approve it. Waiting for approval costs no runner time.
  approve:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Approved
        run: echo "Publishing the snapshot distributions of $GITHUB_SHA approved."

  publish:
    needs: approve
    # The bucket credentials are secrets of this environment, which only accepts main, release/** and v* tags.
    environment: release-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Only latest.json is shared between runs; serialize the uploads so it names the most recently published build.
    concurrency:
      group: bloxbean-snapshot-dist
      cancel-in-progress: false
    env:
      BUCKET: ${{ vars.R2_BUCKET }}
      PREFIX: dist/snapshots/yano-x
      PUBLIC_URL: https://repo.bloxbean.org
      DIST_DIR: dist
      AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      # AWS CLI 2.23+ sends request checksums R2 does not accept by default; send them only when an API needs one.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the built distributions
        uses: actions/download-artifact@v4
        with:
          pattern: '*dist*'
          path: dist
          merge-multiple: true

      # Yano X-specific: the zip names carry the version with the short commit id. The JVM distribution and the
      # plugin pack drop -SNAPSHOT from their names, the deployment tool and Studio keep it. Exactly these four
      # archives of this commit, nothing else.
      - name: Verify the distributions
        id: dist
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          jvm=(yano-x-jvm-[0-9]*.zip)
          VERSION=${jvm[0]#yano-x-jvm-}
          VERSION=${VERSION%.zip}
          if [[ ${#jvm[@]} != 1 || "$VERSION" != *"-${GITHUB_SHA:0:7}" ]]; then
            echo "::error::Expected one JVM zip of commit ${GITHUB_SHA:0:7}; found: ${jvm[*]}" >&2
            exit 1
          fi
          expected="yano-x-jvm-$VERSION.zip"
          expected+=$'\n'"yano-x-plugin-pack-$VERSION.zip"
          expected+=$'\n'"yano-x-deploy-$VERSION-SNAPSHOT.zip"
          expected+=$'\n'"yano-x-studio-$VERSION-SNAPSHOT.zip"
          found=$(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "$found" != "$(sort <<< "$expected")" ]]; then
            echo "::error::Unexpected distribution set: $(tr '\n' ' ' <<< "$found")" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write the manifest
        env:
          VERSION: ${{ steps.dist.outputs.version }}
        run: bash .github/scripts/bloxbean-dist.sh manifest

      # Files and SHA256SUMS first, then manifest.json, which marks the build as published, then latest.json. A
      # published build is never overwritten, so its URLs and checksums stay valid until it expires; a run that
      # stopped before the manifest is completed by running again.
      - name: Upload to the bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ steps.dist.outputs.version }}
        run: bash .github/scripts/bloxbean-dist.sh upload

      - name: Verify the public files
        env:
          VERSION: ${{ steps.dist.outputs.version }}
        run: bash .github/scripts/bloxbean-dist.sh verify

      - name: Record the publication
        env:
          VERSION: ${{ steps.dist.outputs.version }}
        run: bash .github/scripts/bloxbean-dist.sh summary
