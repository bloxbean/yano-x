name: Build and verify Yano X

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Jobs to run manually
        required: true
        default: connector-runtime
        type: choice
        options:
          - connector-runtime
          - all
      yano_version:
        description: Published or staged Yano version (falls back to YANO_VERSION repository variable)
        required: false
        type: string
      yano_jvm_dist_url:
        description: Optional matching Yano JVM ZIP URL override (falls back to YANO_JVM_DIST_URL)
        required: false
        type: string
      yano_maven_repository_url:
        description: Optional staged Yano Maven repository (falls back to YANO_MAVEN_REPOSITORY_URL)
        required: false
        type: string
      yano_inputs_run_id:
        description: Optional successful bloxbean/yano staging run containing exact Maven/JVM inputs
        required: false
        type: string
      yano_inputs_commit:
        description: Independently pinned full host commit for the staging run (required with run ID)
        required: false
        type: string
  schedule:
    - cron: '23 3 * * 1'
  push:
    branches:
      - main
      - develop
      - develop*
      - release*
      - next
  pull_request:
    branches:
      - main
      - develop
      - develop*
      - release*
      - next

permissions:
  contents: read
  actions: read

env:
  YANO_VERSION: ${{ inputs.yano_version || vars.YANO_VERSION }}
  YANO_JVM_DIST_URL: ${{ inputs.yano_jvm_dist_url || vars.YANO_JVM_DIST_URL }}
  YANO_MAVEN_REPOSITORY_URL: ${{ inputs.yano_maven_repository_url || vars.YANO_MAVEN_REPOSITORY_URL }}
  YANO_INPUTS_RUN_ID: ${{ inputs.yano_inputs_run_id }}
  YANO_INPUTS_COMMIT: ${{ inputs.yano_inputs_commit }}

jobs:
  commit-build:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.scope == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Test pinned input preparation
        run: bash .github/scripts/tests/prepare-yano-inputs-test.sh
      - name: Prepare exact Yano build inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/prepare-yano-inputs.sh
      - name: Stage Yano X publications in the isolated build repository
        run: ./gradlew publishAllPublicationsToInternalRepository -PskipSigning=true --stacktrace
      - name: Build and test JVM extensions
        run: ./gradlew check -PskipSigning=true --stacktrace
      # Fails the PR, not release day, when a module starts or stops publishing without the Central
      # deployment scope (config/artifacts-v1.json, gradle/publishing.gradle) following it.
      - name: Verify Maven Central publication scope
        run: ./gradlew verifyMavenReleasePublicationScope -PskipSigning=true --stacktrace
      - name: Prepare packaged evidence-demo inputs
        run: ./gradlew :distribution:jvm:prepareEvidenceDemoArtifacts -PskipSigning=true --stacktrace
      - name: Verify evidence demo release contracts
        run: bash products/evidence/harness/tests/release-contracts.sh

  distribution-check:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.scope == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Prepare exact Yano build inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/prepare-yano-inputs.sh
      - name: Stage Yano X publications in the isolated build repository
        run: ./gradlew publishAllPublicationsToInternalRepository -PskipSigning=true --stacktrace
      - name: Verify plugin pack and JVM distribution
        run: ./gradlew distributionCheck -PskipSigning=true --stacktrace

  connector-fault-matrix:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name != 'workflow_dispatch' ||
      inputs.scope == 'connector-runtime' || inputs.scope == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Prepare exact Yano build inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/prepare-yano-inputs.sh
      - name: Stage Yano X publications in the isolated build repository
        run: ./gradlew publishAllPublicationsToInternalRepository -PskipSigning=true --stacktrace
      - name: Run real connector restart and fault matrix
        run: products/evidence/harness/tests/connector-fault-matrix.sh
      - name: Run Kafka sink and executor over TLS and SASL/TLS
        run: connectors/kafka/src/test/scripts/kafka-secure-integration.sh

  # The evidence devnet E2E runs in evidence-e2e.yml, and tag-release.yml requires it to have passed on the commit
  # it tags.
  release-acceptance:
    needs:
      - commit-build
      - distribution-check
      - connector-fault-matrix
    if: >-
      always() &&
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.scope == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Yano X release gate
        env:
          COMMIT_BUILD_RESULT: ${{ needs.commit-build.result }}
          DISTRIBUTION_CHECK_RESULT: ${{ needs.distribution-check.result }}
          CONNECTOR_FAULT_RESULT: ${{ needs.connector-fault-matrix.result }}
        run: |
          set -euo pipefail
          test "$COMMIT_BUILD_RESULT" = success
          test "$DISTRIBUTION_CHECK_RESULT" = success
          test "$CONNECTOR_FAULT_RESULT" = success
          printf '%s\n' 'PASS: Yano X release acceptance gates succeeded'
