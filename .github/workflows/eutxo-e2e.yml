name: eUTxO settlement E2E

# Runs the eUTxO ledger's settlement devnet tests from :fixtures:eutxo-e2e against the packaged
# distribution. They are slower than the build, so they run only when eUTxO code changes, or on demand.
on:
  workflow_dispatch:
    inputs:
      yano_version:
        description: Published or staged Yano version (falls back to YANO_VERSION repository variable)
        required: false
        type: string
      yano_jvm_dist_url:
        description: Optional matching Yano JVM ZIP URL override (falls back to YANO_JVM_DIST_URL)
        required: false
        type: string
      yano_maven_repository_url:
        description: Optional staged Yano Maven repository (falls back to YANO_MAVEN_REPOSITORY_URL)
        required: false
        type: string
      yano_inputs_run_id:
        description: Optional successful bloxbean/yano staging run containing exact Maven/JVM inputs
        required: false
        type: string
      yano_inputs_commit:
        description: Independently pinned full host commit for the staging run (required with run ID)
        required: false
        type: string
  push:
    branches:
      - main
      - develop
      - develop*
      - release*
      - next
    paths:
      - 'ledgers/eutxo/**'
      - 'fixtures/eutxo-e2e/**'
      - '.github/workflows/eutxo-e2e.yml'
  pull_request:
    branches:
      - main
      - develop
      - develop*
      - release*
      - next
    paths:
      - 'ledgers/eutxo/**'
      - 'fixtures/eutxo-e2e/**'
      - '.github/workflows/eutxo-e2e.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: eutxo-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  YANO_VERSION: ${{ inputs.yano_version || vars.YANO_VERSION }}
  YANO_JVM_DIST_URL: ${{ inputs.yano_jvm_dist_url || vars.YANO_JVM_DIST_URL }}
  YANO_MAVEN_REPOSITORY_URL: ${{ inputs.yano_maven_repository_url || vars.YANO_MAVEN_REPOSITORY_URL }}
  YANO_INPUTS_RUN_ID: ${{ inputs.yano_inputs_run_id }}
  YANO_INPUTS_COMMIT: ${{ inputs.yano_inputs_commit }}

jobs:
  eutxo-settlement-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Prepare exact Yano build inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/prepare-yano-inputs.sh
      - name: Stage Yano X publications in the isolated build repository
        run: ./gradlew publishAllPublicationsToInternalRepository -PskipSigning=true --stacktrace
      - name: Run settlement bootstrap and effect-path devnet E2E
        run: ./gradlew :fixtures:eutxo-e2e:e2eTest -PskipSigning=true --stacktrace
      - name: Upload test reports and node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eutxo-e2e-reports
          path: |
            fixtures/eutxo-e2e/build/reports/tests/e2eTest/
            fixtures/eutxo-e2e/build/e2e/runs/*/node.log
          if-no-files-found: ignore
