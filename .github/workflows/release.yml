name: Release Yano X

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q properties | awk '/^version:/ { print $2; exit }')
          if [[ "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "Git tag $GITHUB_REF_NAME does not match Gradle version $VERSION" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-SNAPSHOT* ]]; then
            echo "Release tags require a non-SNAPSHOT version. Got: $VERSION" >&2
            exit 1
          fi
          PRERELEASE=true
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build and verify all release distributions
        run: ./gradlew clean build -PskipSigning=true --stacktrace

      - name: Stage release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          cp "distribution/jvm/build/distributions/yano-x-jvm-${VERSION}.zip" release-assets/
          cp "distribution/jvm/build/distributions/yano-x-plugin-pack-${VERSION}.zip" release-assets/
          cp "examples/showcase/build/distributions/yano-showcase-${VERSION}.zip" release-assets/
          cp "tooling/studio/build/distributions/yano-x-studio-${VERSION}.zip" release-assets/
          cp "tooling/deployment/build/distributions/yano-x-deploy-${VERSION}.zip" release-assets/
          for archive in release-assets/*.zip; do
            unzip -tq "$archive"
          done
          (cd release-assets && sha256sum *.zip > SHA256SUMS)

      - name: Verify reusable Maven publication scope
        run: ./gradlew verifyMavenReleasePublicationScope -PskipSigning=true

      - name: Decode GPG key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$HOME/.gradle/secring.gpg"

      # Uploads a USER_MANAGED deployment and waits for Sonatype validation. It
      # stops there: nothing is on Maven Central until a human publishes it, via
      # publish-central.yml or the portal. See gradle/publishing.gradle.
      - name: Upload deployment to Maven Central staging
        id: upload
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not add --warn here. It lowers Gradle below LIFECYCLE, which is
          # the level nmcp reports the deployment id at, and the grep below
          # would then fail every release after a successful upload.
          ./gradlew publishAggregationToCentralPortal \
            -Psigning.keyId=${{ secrets.SIGNING_KEY_ID }} \
            -Psigning.password=${{ secrets.SIGNING_PASSWORD }} \
            -Psigning.secretKeyRingFile=$HOME/.gradle/secring.gpg \
            --stacktrace 2>&1 | tee upload.log
          # The deployment id exists only in nmcp's output. Fail loudly if the
          # log format changes rather than reporting a release with no id.
          id=$(grep -oE "deployment bundle '[0-9a-f-]{36}'" upload.log \
            | head -1 | grep -oE '[0-9a-f-]{36}' || true)
          if [[ -z "$id" ]]; then
            echo "::error::Upload succeeded but no deployment id was found in the log." >&2
            exit 1
          fi
          echo "deployment-id=$id" >> "$GITHUB_OUTPUT"

      - name: Record the pending deployment
        env:
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment-id }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Maven Central deployment staged - NOT published"
            echo
            echo "Deployment \`$DEPLOYMENT_ID\` (\`yano-x:$VERSION\`) passed validation"
            echo "and is waiting for a human."
            echo
            echo "Publish it through the approval-gated workflow:"
            echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/publish-central.yml"
            echo
            echo "Or from the portal: https://central.sonatype.com/publishing/deployments"
            echo
            echo "Note: the GitHub release created below is already public."
            echo "Maven Central is not, until the deployment above is published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release with five distributions
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
