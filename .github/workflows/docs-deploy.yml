name: Documentation

on:
  pull_request:
    paths: ['www/**', 'gradle.properties']
  push:
    branches: [main]
    paths: ['www/**', 'gradle.properties']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          # Fail if a page is absent from the curated llms.txt sections.
          YANO_X_REQUIRE_LISTED_DOCS: '1'
        run: npm run build

      - name: Verify rendered diagrams and navigation
        run: |
          npx playwright install --with-deps chromium
          npm run check:browser

      - name: Verify AI artifacts
        run: |
          set -euo pipefail
          for f in llms.txt llms-full.txt ai/catalog.json ai/starter-pack.md ai/index.md; do
            test -s "dist/$f" || { echo "missing or empty: dist/$f"; exit 1; }
          done
          test -s dist/studio/index.html || { echo "missing: dist/studio/index.html"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: yano-x-docs-preview
          path: www/dist

  publish:
    name: Publish documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # No `environment:` here. The live site only changes once GitHub's own pages-build-deployment run for
    # this gh-pages push is approved in the `github-pages` environment; naming the environment on this job
    # as well would ask for two approvals per deploy.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yano-x-docs-preview
          path: site

      - name: Publish documentation to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: yano-x.io

      - name: Record the pending Pages deployment
        shell: bash
        run: |
          {
            echo "## Pushed to gh-pages - waiting for approval"
            echo
            echo "The site updates after the \`pages-build-deployment\` run for this push is approved in the"
            echo "\`github-pages\` environment:"
            echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/pages/pages-build-deployment"
            echo
            echo "If several are waiting, approve the newest and reject the older ones."
          } >> "$GITHUB_STEP_SUMMARY"
