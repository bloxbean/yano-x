name: Deploy docsite to GitHub Pages

# The documentation site ships independently of code releases: it reads
# repository text files only and needs no Java, Gradle, or Yano artifacts.
# Tag with `dv<n>` to publish.
on:
  push:
    tags:
      - 'dv*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install dependencies
        working-directory: www
        run: npm ci

      - name: Build site
        working-directory: www
        env:
          # Fail the build if a page is missing from the curated llms.txt
          # sections, rather than silently appending it to "Other".
          YANO_X_REQUIRE_LISTED_DOCS: '1'
        run: npm run build

      - name: Verify the AI artifacts were published
        working-directory: www
        run: |
          set -euo pipefail
          for f in llms.txt llms-full.txt ai/catalog.json ai/starter-pack.md ai/index.md; do
            test -s "dist/$f" || { echo "missing or empty: dist/$f"; exit 1; }
          done
          test -s dist/studio/index.html || { echo "missing: dist/studio/index.html"; exit 1; }
          echo "AI artifacts and Studio present."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www/dist
          cname: yanox.dev
