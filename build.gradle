plugins {
    id 'base'
    id 'org.unbroken-dome.test-sets' version '4.1.0' apply false
    id 'com.gradleup.nmcp' version '1.6.2' apply false
    id 'com.gradleup.nmcp.aggregation' version '1.6.2'
    id 'com.gradleup.shadow' version '9.4.1' apply false
    id 'org.cyclonedx.bom' version '3.3.0'
}

abstract class CryptoTestLock implements
        org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {
}

// Build identity. config/artifacts-v1.json is the single source of truth for
// which projects exist, what they publish, and which runtime bundle they own.
def artifactInventory = new groovy.json.JsonSlurper().parse(
        layout.projectDirectory.file('config/artifacts-v1.json').asFile)
def yanoVersion = providers.gradleProperty('yanoVersion').getOrElse('unspecified')

def artifactByPath = artifactInventory.artifacts.collectEntries { artifact ->
    [(artifact.modulePath.toString()): artifact]
}

ext.yanoXArtifactInventory = artifactInventory
ext.artifactByPath = artifactByPath
ext.yanoXMavenReleasePublicationTypes = [
        'runtime-plugin',
        'library',
        'test-library',
        'onchain-artifact'
] as Set
ext.yanoXCryptoTestLock = gradle.sharedServices.registerIfAbsent(
        'yanoXCryptoTestLock', CryptoTestLock) {
    maxParallelUsages = 1
}
// Yano host coordinates are pinned to the upstream Yano group, independent
// of the Yano X group above.
ext.yanoModule = { String artifactId ->
    "org.yanoproject:${artifactId}:${yanoVersion}"
}

// Dependency resolution. Maven Local is opt-in only, so a coordinated local
// Yano build can never leak into an ordinary or release build by accident.
def localRepositoryValue = providers.gradleProperty('useMavenLocal')
        .getOrElse('false')
if (!(localRepositoryValue in ['true', 'false'])) {
    throw new GradleException('useMavenLocal must be true or false')
}
def useLocalRepository = Boolean.parseBoolean(localRepositoryValue)
def internalRepository = providers.gradleProperty('internalRepository')
def yanoRepository = providers.gradleProperty('yanoRepository')

allprojects {
    group = providers.gradleProperty('group').get()
    version = providers.gradleProperty('version').get()

    repositories {
        if (internalRepository.isPresent()) {
            maven {
                name = 'yanoXInternal'
                url = uri(internalRepository.get())
            }
        }
        if (yanoRepository.isPresent()) {
            maven {
                name = 'stagedYano'
                url = uri(yanoRepository.get())
            }
        }
        if (useLocalRepository) {
            mavenLocal()
        }
        mavenCentral()
        maven {
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
        }
    }
}

apply from: file('gradle/sbom.gradle')
apply from: file('gradle/publishing.gradle')

// Every inventoried module except the end-to-end fixture and static web
// applications is an ordinary published Java library.
subprojects.findAll { candidate ->
    artifactByPath.containsKey(candidate.path)
            && candidate.path != ':fixtures:eutxo-e2e'
            && artifactByPath[candidate.path].publicationType != 'web-application'
}.each { candidate ->
    candidate.apply from: rootProject.file('gradle/yano-x-module.gradle')
}

apply from: file('gradle/plugin-bundle-host-classes.gradle')
apply from: file('gradle/verification.gradle')
