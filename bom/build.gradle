plugins {
    id 'java-platform'
    id 'maven-publish'
    // The BOM is not in config/artifacts-v1.json, so gradle/yano-x-module.gradle
    // never reaches it; without this it would drop out of the Central deployment.
    id 'com.gradleup.nmcp'
    id 'signing'
}

description = 'Version alignment platform for Yano X extensions and their Yano host'

def yanoVersion = providers.gradleProperty('yanoVersion')
def artifactInventory = rootProject.ext.yanoXArtifactInventory

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform("com.bloxbean.cardano:yano-bom:${yanoVersion.getOrElse('unspecified')}")
    constraints {
        artifactInventory.artifacts.findAll { artifact ->
            rootProject.ext.yanoXMavenReleasePublicationTypes.contains(
                    artifact.publicationType.toString())
        }.each { artifact ->
            api "${artifactInventory.group}:${artifact.artifactId}:${project.version}"
            if (artifact.bundleArtifactId != null) {
                api "${artifactInventory.group}:${artifact.bundleArtifactId}:${project.version}"
            }
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'yano-x-bom'
            from components.javaPlatform
            rootProject.ext.yanoXPom(
                    pom,
                    'Yano X BOM',
                    'Version alignment for the Yano X JVM extension ecosystem')
        }
    }
}

if (!project.version.toString().endsWith('SNAPSHOT')
        && !project.hasProperty('skipSigning')) {
    signing.sign(publishing.publications)
}

tasks.named('generatePomFileForMavenJavaPublication') {
    doFirst {
        if (!yanoVersion.isPresent()) {
            throw new GradleException('yanoVersion is required')
        }
    }
}
