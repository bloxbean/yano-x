                proofOfPossession: "edf2accfcb807d420c0f5d16c30a9db1230d3ba7af9e861caf3c8de15b8cd2adbb1f32730c52aea1e2751f17cb3e00d8334d102a5b34df21f6f6dc1977235d0b"
                validFromHeight: 1
                validUntilHeight: 0
                status: active
          - id: auditor-b
            revision: 1
            organization: auditor-guild-b
            status: active
            roles: [auditor]
            keys:
              - id: auditor-b-k1
                algorithm: ed25519
                publicKey: "b0dc3aadb1754c025699b57789292055d100dddee5e868c569dee8317898c8d2"
                proofOfPossession: "5c11d7c1cfc574f1321674cade9b60e77154f0dbbe40ce40890a06af2bdb181bedf76b7e451bed42d936fbe28fb705b18a7e74602e98d22275bb5a8a7d15a50b"
