            clauses:
              - {id: independent-auditors, role: auditor, minimumCount: 2, distinctBy: organization}
            rejectionMode: any-eligible
            maximumLifetimeBlocks: 600

  # ADR-033: the stock domain-actor registry, role-aware approvals, document-trail transitions and a
  # one-use approval-consumption receipt, composed by the showcase plugin.
  - id: document-review-chain
    recipe: custom-plugin
    answers:
      stateMachine: "document-review"
    settings:
      block.interval-ms: "1000"
