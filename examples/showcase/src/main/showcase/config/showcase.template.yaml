                proofOfPossession: "27011ed548a57ac4fa6efac72410dbe612355d744bc22ca7cccfcae2e3988e5e98704fecf26a29f49c99ac49b046d91521d5139daabeec4abc322e87f4dbb602"
                validFromHeight: 1
                validUntilHeight: 0
                status: active
          - id: auditor-a
            revision: 1
            organization: auditor-guild-a
            status: active
            roles: [auditor]
            keys:
              - id: auditor-a-k1
                algorithm: ed25519
