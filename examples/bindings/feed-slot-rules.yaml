# ADR-031.4 §6.3: a data feed. An observation must be the source's own insert-only slot
# (<actorId>/<round>, PUT_IF_ABSENT, verified coverage), and its price must lie within the range
# of the open feed record feeds/main, which an approved proposal may change.
# Deterministic local-demo fixture; never use demo keys in production.
# Chain: binding-feed-rules-demo; membership.mode=governed; threshold=2
# Source-checkout fixture regeneration: :state-machines:stdlib:printBindingProductExamples
composite:
  components:
    - id: actors
      machine: domain-actors-component
      topic: actors.v1
      config:
        genesis-cbor-hex: ""
    - id: reviews
      machine: governed-role-approvals
      topic: reviews.v1
      config:
        actor-component: "actors"
        genesis-cbor-hex: ""
    - id: registry
      machine: authenticated-map-component
      topic: registry.v1
      config:
        actors: "actors"
        approvals: "reviews"
        genesis-cbor-hex: ""
      admission:
        - rule: own-insert-only-slot
        - rule: feed-open-and-in-range
  rules:
    - id: own-insert-only-slot
      deny: OBSERVATION_REJECTED
      require:
        - expr: 'writes.all(w, w.collection != "observations" || (w.op == "PUT_IF_ABSENT" && w.coverage == "direct" && startsWith(w.keyText, w.actorId + "/")))'
    - id: feed-open-and-in-range
      deny: OBSERVATION_OUT_OF_RANGE
      reads:
        feed: { component: registry, namespace: feeds, key: { literal: "main" } }
      require:
        - expr: 'reads.feed.present && reads.feed.value.status == "OPEN"'
        - expr: 'writes.all(w, w.collection != "observations" || (w.value.price >= reads.feed.value.min && w.value.price <= reads.feed.value.max))'
  bindings:
    - id: apply-approved
      from: { component: reviews, event: role-approvals.proposal-approved.v1 }
      to:
        component: registry
        command: apply-action
        map:
          action: { field: action }
          approvalReference: { field: proposalId }
